# VibeSpec — Specification-Driven Development for AI agents, published as the
# `vibespec` skillset (upstream: v0lka/skills, development/vibespec; the former
# `sdd` skillset, whose skills now carry the `vibespec-` prefix). Every artifact
# is plain Markdown under specs/: META.md owns the format and the rules, INDEX.md
# owns the task-to-spec navigation, WORKFLOW.md is conditional, and architecture/,
# domains/, contracts/ and decisions/ hold the standing descriptions.
schema: sdd-framework/v1
id: vibespec
label: VibeSpec
description: >-
  Specification-Driven Development for AI agents, shipped as the vibespec
  skillset. vibespec-init bootstraps a plain-Markdown specs/ tree: META.md
  (format, templates and conventions), INDEX.md (task-to-spec navigation),
  architecture/ (system-level concerns), domains/ (per-domain overviews with
  their component details), contracts/ (boundaries between layers) and
  decisions/ (NNN-slug ADRs beside their _template.md). The skills keep that
  tree aligned with the code — vibespec-explore turns unclear requirements into
  an approved roadmap, vibespec-consult loads the governing constraints before a
  structural change, and vibespec-update, vibespec-create and vibespec-check
  reconcile the documents afterwards (an accepted ADR stays immutable). No wiki
  engine, database or external service is required.
docs_url: https://github.com/v0lka/skills/tree/main/development/vibespec
priority: 10

detect:
  # The TREE signal: every artifact vibespec-init creates or maintains. Markers
  # never make the framework visible (visibility is the skill set below); they
  # rank a recognised framework as tree-present for the default selection and
  # feed the panel's empty state. Directories are valid probes — a workspace that
  # keeps specs/architecture, specs/domains, specs/contracts or specs/decisions
  # has the tree even when a root file was renamed.
  markers:
    - specs/META.md
    - specs/INDEX.md
    - specs/WORKFLOW.md
    - specs/architecture
    - specs/domains
    - specs/contracts
    - specs/decisions
    - specs/decisions/_template.md
  skills:
    dirs:
      - .agents/skills
      - .claude/skills
    # The visibility signal is the WHOLE skillset, not a sample of it: the six
    # skills are lifecycle (init, explore) and continuous (consult, update,
    # create, check), and an installation may legitimately carry only some of
    # them (a workspace run by consult + update + check alone is still a
    # VibeSpec workspace). Any installed skill therefore recognises the
    # framework — the names below are the exact directory names the upstream
    # skillset ships, and the detector compares skill names exactly: a
    # pre-rename `spec-*` directory is a different skill name, not an alias of
    # these, so it recognises nothing here.
    any_of:
      - vibespec-init
      - vibespec-explore
      - vibespec-consult
      - vibespec-update
      - vibespec-create
      - vibespec-check

roots:
  - id: specs
    path: specs
    label: Specification tree
    required: true

concepts:
  - kind: meta
    label: Meta
    match:
      root: specs
      glob: META.md
    extract: [title, headings, cross_refs]
    required: [title, non_empty]

  - kind: index
    label: Index
    match:
      root: specs
      glob: INDEX.md
    extract: [title, headings, cross_refs, index_tasks]
    required: [title, non_empty]

  # The four section concepts span their whole subtree (the reader the DSL
  # replaced recursed into nested directories) but shed their `_`-prefixed
  # templates: a template is a naming convention, not a standing description,
  # and it must not enter the views, the INDEX coverage or the content checks.
  - kind: architecture
    label: Architecture
    match:
      root: specs
      glob: architecture/**/*.md
      exclude: ["architecture/**/_*.md"]
    extract: [title, key_files, cross_refs, headings]
    required: [title]

  - kind: domain
    label: Domain
    match:
      root: specs
      glob: domains/**/*.md
      exclude: ["domains/**/_*.md"]
    extract: [title, key_files, cross_refs, headings]
    required: [title]

  - kind: contract
    label: Contract
    match:
      root: specs
      glob: contracts/**/*.md
      exclude: ["contracts/**/_*.md"]
    extract: [title, key_files, cross_refs, headings]
    required: [title]

  - kind: decision
    label: Decision
    match:
      root: specs
      glob: decisions/**/*.md
      exclude: ["decisions/**/_*.md"]
    extract: [title, number, status, superseded_by, cross_refs, headings]
    required: [title, status]

  - kind: template
    label: Template
    match:
      root: specs
      glob: decisions/**/_*.md
    extract: [title]
    required: [title]

checks:
  # 1. META.md and INDEX.md are the two root documents every tree carries.
  - kind: required_files
    finding: ROOT_FILE_MISSING
    message: the specification tree must carry INDEX.md (navigation) and META.md (format and rules)
    files: [INDEX.md, META.md]

  # 2. Every path a document lists under "## Key Files" must exist.
  - kind: required_files
    finding: PATH_MISSING
    message: a key file listed by a spec must exist in the workspace
    from: key_files

  # 3. ADR file names are NNN-slug.md; _template.md is the one exception.
  - kind: name_pattern
    finding: ADR_NAME_MALFORMED
    message: a decisions/ file must be named NNN-slug.md
    concept: decision
    pattern: '^[0-9]{3}-[a-z0-9]+(?:-[a-z0-9]+)*\.md$'
    allow: [_template.md]

  # 4. Relative spec links and their anchors must resolve.
  - kind: crossrefs
    finding: CROSS_REF_BROKEN
    message: a relative spec link or anchor must resolve

  # 5. INDEX.md must name every section document.
  - kind: index_completeness
    finding: INDEX_STALE
    message: INDEX.md must name every architecture, domains, contracts and decisions document
    concept: index
    covers: [architecture, domain, contract, decision]

  # 6. An ADR's H1 number must equal its file name's number — numerically,
  #    when the heading spells one. A heading without an "ADR-NNN:" prefix is
  #    not a mismatch (optional), and the comparison is numeric, so an
  #    unpadded heading ("# ADR-43:") agrees with 043-ok.md.
  - kind: content_regex
    finding: ADR_NUMBER_MISMATCH
    message: the "# ADR-NNN:" heading number must equal the file name's number
    concept: decision
    in: first_heading
    optional: true
    regex: '^ADR-(?P<number>\d+): \S'
    capture: number
    equals: filename_number

  # 7. Two decision files may not claim one number.
  - kind: unique
    finding: DUPLICATE_ADR_NUMBER
    message: two decisions/ files claim the same ADR number
    concept: decision
    field: number

  # 8. A supersession target must be a real ADR, and chains must terminate:
  #    one declared check judges both — resolution under SUPERSEDED_TARGET_MISSING,
  #    loops under SUPERSEDED_CYCLE.
  - kind: references
    finding: SUPERSEDED_TARGET_MISSING
    cycle_finding: SUPERSEDED_CYCLE
    message: a superseded ADR must name an existing successor and supersession chains must not loop
    concept: decision
    field: superseded_by
    of: decision
    acyclic: true

actions:
  - kind: init
    label: Init
    skill: vibespec-init
    prompt: Initialize the VibeSpec specification system for this workspace.
  - kind: check
    label: Check
    skill: vibespec-check
    prompt: Check the specifications for drift against the code and the documented invariants.
    requires: [root]
  - kind: consult
    label: Consult
    skill: vibespec-consult
    prompt: Consult the relevant specifications before making this change.
    requires: [root]
  - kind: explore
    label: Explore
    skill: vibespec-explore
    prompt: Explore the design space with the specifications open, before planning any change.
    requires: [root]
  - kind: create
    label: Create
    skill: vibespec-create
    prompt: Create a new specification document for the described domain, contract or decision.
    requires: [root]
  - kind: update
    label: Update
    skill: vibespec-update
    prompt: Update the specifications affected by the current changes.
    requires: [root, findings]
  # The findings gesture: declared here so the panel's findings badge is a
  # BUTTON for this framework (a framework that omits it keeps an inert
  # badge — the panel renders only what the DSL declares).
  - kind: fix-findings
    label: Fix findings
    skill: vibespec-update
    prompt: >-
      Repair every integrity finding reported for the specs/ tree: fix or
      remove broken paths and cross-references, renumber duplicate ADR records
      per the renumber protocol, register unlisted files in the INDEX.md
      directory listing, restore missing root files, and repair ADR numbering
      and supersession inconsistencies. When done, re-verify that the tree
      parses clean.
    requires: [root, findings]

views:
  sections:
    - id: tree
      label: Specification tree
      kind: tree
      concepts: [meta, index, architecture, domain, contract, decision]
    - id: findings
      label: Findings
      kind: findings

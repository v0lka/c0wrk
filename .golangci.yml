version: "2"

run:
  timeout: 5m

linters:
  exclusions:
    paths:
      - "frontend/node_modules"
    rules:
      - linters: [revive]
        text: "empty-block"
        path: _test\.go
      # Windows clipboard syscalls necessarily convert the uintptr returned by
      # LazyProc.Call() back to unsafe.Pointer (the Win32 pointer convention).
      # govet's unsafeptr analyzer can't prove the uintptr originated from a
      # valid pointer, so it false-positives on idiomatic syscall glue. Scoped
      # to this single file/analyzer; all other govet checks stay active.
      - linters: [govet]
        text: "unsafeptr"
        path: backend/session/clipboard_windows\.go
  enable:
    # Core: bug detection
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused

    # Error handling
    - errorlint
    - nilerr

    # Code quality
    - gocritic
    - revive
    - unconvert
    - wastedassign
    - copyloopvar
    - durationcheck
    - noctx
    - bodyclose
    - sqlclosecheck
    - perfsprint
    - prealloc
    - whitespace
    - depguard

  # Formatters (stricter-than-gofmt checks). gofumpt is a strict superset of
  # gofmt and catches misalignments that gofmt alone misses.
  formatters:
    enable:
      - gofumpt
    exclusions:
      paths:
        - "frontend/node_modules"

  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      disabled-checks:
        - hugeParam
        - rangeValCopy
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
          disabled: true
        - name: increment-decrement
        - name: var-naming
          disabled: true
        - name: range
        - name: receiver-naming
        - name: indent-error-flow
        - name: empty-block
        - name: superfluous-else
        - name: unreachable-code
        - name: redefines-builtin-id
    errcheck:
      check-type-assertions: true
    perfsprint:
      err-error: true
      errorf: true
      sprintf1: true
    prealloc:
      simple: true
      for-loops: true
    depguard:
      rules:
        core-no-backend:
          list-mode: lax
          files:
            - "**/core/**"
          deny:
            - pkg: "github.com/v0lka/c0wrk/backend"
              desc: "core must not import backend (layering violation)"

version: "2"

run:
  timeout: 5m

linters:
  exclusions:
    paths:
      - "frontend/node_modules"
    rules:
      - linters: [revive]
        text: "empty-block"
        path: _test\.go
  enable:
    # Core: bug detection
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused

    # Error handling
    - errorlint
    - nilerr

    # Code quality
    - gocritic
    - revive
    - unconvert
    - wastedassign
    - copyloopvar
    - durationcheck
    - noctx
    - bodyclose
    - sqlclosecheck
    - perfsprint
    - prealloc
    - whitespace
    - depguard

  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      disabled-checks:
        - hugeParam
        - rangeValCopy
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
          disabled: true
        - name: increment-decrement
        - name: var-naming
          disabled: true
        - name: range
        - name: receiver-naming
        - name: indent-error-flow
        - name: empty-block
        - name: superfluous-else
        - name: unreachable-code
        - name: redefines-builtin-id
    errcheck:
      check-type-assertions: true
    perfsprint:
      err-error: true
      errorf: true
      sprintf1: true
    prealloc:
      simple: true
      for-loops: true
    depguard:
      rules:
        sdk-no-core:
          list-mode: lax
          files:
            - "**/sdk/**"
          deny:
            - pkg: "github.com/v0lka/c0wrk/core"
              desc: "sdk must not import core (layering violation)"
            - pkg: "github.com/v0lka/c0wrk/backend"
              desc: "sdk must not import backend (layering violation)"
        core-no-backend:
          list-mode: lax
          files:
            - "**/core/**"
          deny:
            - pkg: "github.com/v0lka/c0wrk/backend"
              desc: "core must not import backend (layering violation)"

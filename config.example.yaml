log_level: DEBUG
theme: system
llm:
    active_provider: lmstudio
    anthropic:
        api_key: ""
        model: ""
    gemini:
        api_key: ""
        model: ""
    lmstudio:
        base_url: http://localhost:1234
        api_key: ""
        model: ""
    openai_compatible:
        base_url: ""
        api_key: ""
        model: ""
    chatgpt:
        api_key: ""
        model: gpt-5.4
    models: {}
    retry:
        max_retries: 3
        initial_backoff: 1s
        max_backoff: 30s
mcp:
    servers: {}
external_tools:
    directory: ""
memory:
    database: ""
    episodic:
        retention_days: 90
        retrieval_limit: 5
    constitution:
        file: ""
        update_interval_sessions: 10
router:
    history_window: 10
executor:
    max_react_steps: 30
    max_retries: 2
    output_token_reserve: 4096
    compaction:
        sliding_window:
            keep_first: 3
            keep_last: 10
        summarization:
            block_size: 7
        hierarchical:
            enabled_above_steps: 40
        thresholds:
            predictive_percent: 85
            warning_percent: 92
            emergency_percent: 98
    tool_result_budget:
        hard_cap_tokens: 8192
        max_fill_fraction: 0.3
security:
    judge:
        enabled: true
        model: ""
    tool_policies:
        bash_exec:
            policy: auto
            blacklist:
                - rm\s+-rf\s+/
                - sudo\s+
                - mkfs
                - dd\s+if=
                - '>\s*/dev/'
        file_ops:
            policy: auto
            blacklist: []
        web_fetch:
            policy: always_allow
            blacklist: []
        web_search:
            policy: always_allow
            blacklist: []
    default_policy: auto
search:
    provider: ""
    api_key: ${TAVILY_API_KEY}

# Example configuration for the Agent
# Copy this file to ~/.c0wrk/config.yaml and fill in your API keys

log_level: DEBUG
theme: system

llm:
  active_provider: anthropic

  anthropic:
    api_key: "${ANTHROPIC_API_KEY}"
    model: claude-sonnet-4-20250514

  # gemini:
  #   api_key: "${GEMINI_API_KEY}"
  #   model: gemini-2.5-pro

  # lmstudio:
  #   base_url: "http://localhost:1234"
  #   api_key: ""
  #   model: my-local-model

  # openai_compatible:
  #   base_url: "https://api.deepseek.com"
  #   api_key: "${DEEPSEEK_API_KEY}"
  #   model: deepseek-chat

  # chatgpt:
  #   api_key: "${OPENAI_API_KEY}"
  #   model: gpt-4o

  # Model metadata overrides (optional, overrides built-in registry)
  # models:
  #   my-custom-model:
  #     context_window: 32000
  #     output_limit: 4096

  # Retry configuration for transient LLM API errors (network, rate-limit, 5xx)
  # retry:
  #   max_retries: 3         # max retry attempts (0 = disabled)
  #   initial_backoff: "1s"  # initial backoff before first retry
  #   max_backoff: "30s"     # maximum backoff cap

executor:
  max_react_steps: 30
  max_retries: 3
  output_token_reserve: 4096
  compaction:
    sliding_window:
      keep_first: 3
      keep_last: 10

security:
  default_policy: "auto"
  tool_policies:
    bash_exec:
      policy: "user_confirm"
      blacklist:
        - 'rm\s+-rf\s+/'
        - 'sudo\s+'
        - "mkfs"
        - 'dd\s+if='
        - '>\s*/dev/'
    file_ops:
      policy: "auto"
    web_search:
      policy: "always_allow"
    web_fetch:
      policy: "always_allow"

external_tools:
  directory: ""

memory:
  database: ""
  episodic:
    retention_days: 90
    retrieval_limit: 5
  constitution:
    file: ""
    update_interval_sessions: 10

mcp:
  servers: {}

search:
  provider: "tavily"
  api_key: "${TAVILY_API_KEY}"

router:
  history_window: 5

# ===========================================================
# c0wrk Configuration
# ===========================================================
# Copy this file to config.yaml and adjust values as needed.
# Environment variables can be referenced as ${ENV_VAR}.
# ===========================================================

# Logging level: DEBUG, INFO, WARN, ERROR
log_level: "INFO"

# ---------------------------------------------------------------------------
# LLM Provider Configuration
# ---------------------------------------------------------------------------
llm:
  # The single, cross-provider default model — must be enabled in the corresponding
  # provider's models list below.
  #
  # The value may be a bare model name (e.g. "claude-sonnet-4-20250514") or a
  # composite identifier "providerName/modelName" (e.g. "lmstudio/gpt-4"). Use the
  # composite form when the same bare model name is exposed by more than one
  # provider, so the agent routes to the intended provider. A bare name that
  # matches several providers resolves to the first match (alphabetically by
  # provider name) and logs a warning.
  default_model: "claude-sonnet-4-20250514"

  anthropic:
    api_key: "${ANTHROPIC_API_KEY}"
    models:
      - "claude-sonnet-4-20250514"
    # Optional: per-provider output-token budget for every model above.
    # Applies when the provider's real limits differ from the built-in catalog
    # (proxies, gateways). 0 / omitted = inherit executor.output_token_reserve.
    # A per-model llm.models output_limit still wins over this value.
    # output_token_reserve: 12288

  openai_compatible:
    # Each key is a named provider (e.g. "lmstudio", "localai", "ollama").
    # The provider name is used in composite model IDs: "lmstudio/gpt-4".
    # NOTE: reliable tool calling on self-hosted servers (vLLM, llama.cpp, LM Studio,
    # Ollama) requires server-side configuration — see specs/domains/llm-providers.md
    # (parser/template per model family, sampling defaults, context-window sizing).
    lmstudio:
      base_url: "http://localhost:1234/v1"
      api_key: "" # Local servers usually don't need a key
      models:
        - "gpt-4"
        - "deepseek-chat"
      # Optional: output-token budget shared by all models of this provider —
      # both the context-window reserve and the MaxTokens ceiling. Useful when
      # a self-hosted gateway caps output below/above the built-in catalog.
      # 0 / omitted = inherit executor.output_token_reserve.
      # output_token_reserve: 8192
      #
      # TLS override for self-signed / internal-PKI endpoints (per provider):
      #   tls_fingerprint: "..."  — base64(SHA-256(SPKI DER)) pin. A NON-EMPTY
      #                             pin by itself activates the override: only
      #                             the certificate with this public key is
      #                             accepted (so it survives certificate
      #                             renewal that reuses the key pair). The
      #                             Settings dialog's "Get" button fills it in
      #                             by reading whatever the server presents
      #                             right now — it works the same whether or
      #                             not a pin is already set.
      #                             Empty / omitted = normal system CA
      #                             verification. There is no separate toggle
      #                             and no "accept any certificate" mode: a
      #                             wrong pin refuses the connection. See
      #                             ADR-054.
      #   NOTE: while the proxy dials for this host — an effective HTTP
      #   proxy is enabled (proxy.enabled + a proxy.url) AND the host is NOT
      #   on proxy.bypass_list — this pin is IGNORED: proxied connections are
      #   verified by the proxy's own TLS config (proxy.tls_cert_dir). To pin
      #   a server AND use the proxy for everything else, add the server's
      #   host to proxy.bypass_list: a bypassed host dials directly, so its
      #   pin applies. A configured pin is preserved while the proxy is on
      #   and takes effect again once the proxy stops dialing for the host.
      # tls_fingerprint: ""

  anthropic_compatible:
    # Each key is a named provider speaking Anthropic's Messages API
    # (e.g. a proxy, gateway, or local Anthropic-compatible server).
    # The provider name is used in composite model IDs: "my-proxy/claude-sonnet-4-20250514".
    # base_url should point at the endpoint root (with or without a trailing /v1).
    # api_key is optional — local servers may not require authentication.
    # my-proxy:
    #   base_url: "https://my-anthropic-proxy.example.com"
    #   api_key: "${ANTHROPIC_PROXY_KEY}"
    #   models:
    #     - "claude-sonnet-4-20250514"
    #   # Same TLS override as openai_compatible above (tls_fingerprint pin,
    #   # ADR-054) — for self-signed Anthropic-compatible endpoints. Ignored
    #   # while the proxy dials for the host; add the host to
    #   # proxy.bypass_list to pin and proxy simultaneously.
    #   # tls_fingerprint: ""

  chatgpt:
    api_key: "${OPENAI_API_KEY}"
    models: []

  # Override built-in model metadata per model name. Every field is optional and
  # uses a sentinel value meaning "inherit the built-in default": 0 for integers,
  # "" for strings, nil (omitted map) for capabilities. Only fields that differ
  # from the built-in metadata are persisted; when every field matches the
  # default the entry is removed automatically.
  models: {}
  #   "custom-model-name":
  #     # Maximum input+output tokens the model accepts / produces.
  #     context_window: 128000
  #     # Maximum tokens the model may emit in a single response.
  #     output_limit: 8192
  #     # Token counting strategy. One of:
  #     #   "approximate"           — character-ratio heuristic (no network)
  #     #   "tiktoken/o200k_base"   — GPT-4o / o1-family BPE encoding
  #     #   "tiktoken/cl100k_base"  — GPT-4 / GPT-3.5-turbo BPE encoding
  #     #   "anthropic-api"         — server-side counting via Anthropic API
  #     tokenizer_type: "tiktoken/o200k_base"
  #     # Model family — drives prompt formatting and feature detection. One of:
  #     #   "anthropic" | "openai_flagship" | "openai_standard" | "default"
  #     # (The registry recognizes additional families such as "google",
  #     #  "mistral", "deepseek", "qwen", "glm", "kimi", "openai_codex"; the four
  #     #  above are the curated set offered by the Configure dialog.)
  #     family: "openai_standard"
  #     # Wire protocol — request/response shape and endpoint path. One of:
  #     #   "chat_completions"  — OpenAI /v1/chat/completions (most compat servers)
  #     #   "responses"         — OpenAI /v1/responses (GPT-5 / o-series native)
  #     #   "anthropic"         — Anthropic /v1/messages (Claude models)
  #     protocol: "chat_completions"
  #     # Capability flags. Omit the whole map to inherit all built-in flags.
  #     # When present, all four flags are set atomically (a non-nil map fully
  #     # replaces the default set — partial inheritance is not supported).
  #     capabilities:
  #       attachment: true   # accepts image/PDF inputs
  #       reasoning: false   # supports reasoning/thinking mode
  #       temperature: true  # accepts the temperature parameter
  #       tool_call: true    # supports function/tool calling

  # Retry behavior for LLM API calls
  retry:
    max_retries: 3 # Max retry attempts (0 = no retries)
    initial_backoff: "1s" # Initial backoff duration
    max_backoff: "30s" # Maximum backoff duration

# ---------------------------------------------------------------------------
# MCP (Model Context Protocol) Servers
# ---------------------------------------------------------------------------
mcp:
  servers: {}
  #   example-server:
  #     transport: "stdio"         # "stdio" or "http"
  #     command: "npx"             # Command to execute (stdio)
  #     args: ["-y", "some-mcp"]   # Arguments (stdio)
  #     env:                       # Environment variables (stdio)
  #       SOME_VAR: "value"
  #     url: ""                    # HTTP endpoint URL (http transport)
  #     headers: {}                # HTTP headers (http transport)
  #     # Per-server timeouts. Both are Go duration strings — a unit suffix is
  #     # required (e.g. "60s", "2m", "500ms", "1h30m"); a bare number is
  #     # rejected. When a key is omitted, empty, unparseable, or non-positive
  #     # it falls back to the built-in 60s default (a bad value never prevents
  #     # the server from starting).
  #     timeout: "60s"             # Bounds this server's initialization
  #                                # handshake (initialize + tools/list) and is
  #                                # the default bound for every tools/call on
  #                                # it. Default: 60s.
  #     call_timeout: "30s"        # Optional per-call override: bounds a single
  #                                # tools/call independently of the handshake.
  #                                # Unset inherits `timeout`, so a per-call wire
  #                                # timeout is always in effect. A server that
  #                                # times out 3 calls in a row is flagged
  #                                # unhealthy (marked, never killed).

# ---------------------------------------------------------------------------
# Agent Skills Discovery
# ---------------------------------------------------------------------------
# Directories to scan for Agent Skills (agentskills.io spec).
# Each subdirectory with a valid SKILL.md file becomes a skill.
# Paths may be absolute or relative to the agent directory (~/.c0wrk).
# Directories are scanned in priority order (highest first).
skills:
  dirs:
    - "~/.c0wrk/.agents/skills" # c0wrk-specific skills directory (outranks user-wide)
    - "~/.agents/skills" # user-wide skills directory
  # Note: in addition to the directories above, the current project's
  # `.agents/skills` directory is always scanned automatically (highest priority).

# ---------------------------------------------------------------------------
# Subagent Profiles Discovery
# ---------------------------------------------------------------------------
# Directories to scan for Subagent Profiles (<name>/AGENT.md, ADR-021).
# Paths may be absolute or relative to the agent directory (~/.c0wrk).
# Directories are scanned in priority order (highest first).
# Omitting the key entirely keeps the defaults below; an explicit empty
# list opts out of the base directories (mirrors `skills.dirs`).
agents:
  dirs:
    - "~/.c0wrk/.agents/agents" # c0wrk-specific subagent profiles directory (outranks user-wide)
    - "~/.agents/agents" # user-wide subagent profiles directory
  # Note: in addition to the directories above, the current project's
  # `.agents/agents` directory is always scanned automatically (highest priority).
  #
  # Maximum number of subagents running concurrently, applied to every
  # dispatch path (one shared limit): the delegate tool — both its blocking
  # batches and its async launches — and plan waves. Bounding concurrency
  # bounds the peak rate of subagent lifecycle events and simultaneous LLM
  # calls / tool executions. Default: 4. Omitted or 0 → 4.
  max_parallel_subagents: 4

# ---------------------------------------------------------------------------
# Memory / Persistence
# ---------------------------------------------------------------------------
# The SQLite database is always stored at ~/.c0wrk/database.db
# (no longer configurable — the memory.database key is retired).

# ---------------------------------------------------------------------------
# Router
# ---------------------------------------------------------------------------
router:
  history_window: 10 # Number of prior messages included in routing context

# ---------------------------------------------------------------------------
# Executor & Agent Execution
# ---------------------------------------------------------------------------
executor:
  max_retries: 2 # Maximum retries on execution failure (legacy, retained for framework.go)
  # Tokens reserved for model output generation: subtracted from the model's
  # context window during overflow validation and used as the executor's
  # MaxTokens ceiling for models without explicit metadata. Can be overridden
  # per provider (see llm.*.output_token_reserve) and per model
  # (see llm.models.<name>.output_limit) — those win over this global value.
  output_token_reserve: 8192
  # --- Mechanical Edit Verification -----------------------------------------
  # After every SUCCESSFUL write_file / edit_file in a CODE task, run the
  # configured command (e.g. `go test ./...`, `npm test`, `ruff check .`) and
  # inject its truncated output back into the agent context as a system
  # observation — "edit → verify → result" instead of self-attested done.
  #
  # Security: the command is ALWAYS taken from this config, never from the
  # model. It still passes the execute-group deny policy and the shell command
  # blocklist; interactive confirmation is skipped because you authored the
  # command. Re-runs are debounced: no second run until the next new edit.
  # Not active in CHAT (No Project) mode or goal-loop turns. Default: off.
  verify_on_edit:
    enabled: false # Master switch (default off)
    command: "" # e.g. "go test ./... -count=1" — required when enabled
    timeout: 2m # Go duration; empty/invalid falls back to 2m; effectively capped by timeouts.bashMaxTimeout
    max_output_chars: 4000 # Cap on injected output (0 → SDK default 4000)
  # --- Context Compaction ---------------------------------------------------
  compaction:
    # Sliding-window compaction
    sliding_window:
      keep_first: 3 # First N steps always preserved
      keep_last: 10 # Last N steps always preserved

    # Summarization compaction
    summarization:
      block_size: 7 # Steps per summarization block
      keepLast: 5 # Recent steps preserved verbatim

    # Hierarchical (3-zone) compaction
    hierarchical:
      enabled_above_steps: 25 # Activate when step count exceeds this
      distantRatio: 0.4 # Budget ratio for distant zone
      middleRatio: 0.3 # Budget ratio for middle zone
      recentRatio: 0.3 # Budget ratio for recent zone

    # Context-usage thresholds that trigger compaction
    thresholds:
      predictive_percent: 85 # Predictive compaction trigger
      warning_percent: 92 # Warning-level compaction trigger
      emergency_percent: 98 # Emergency compaction trigger
      pre_warning_percent: 75 # store_fact nudge trigger (must be < predictive_percent)

    maxSummarizeTokens: 16000 # Max tokens for summarization LLM calls
    observationTruncate: 500 # Characters to truncate observations in summaries
    safetyMarginPercent: 5 # % of context window reserved as safety margin
    # Compression-ratio forecast seeds for manual-compaction prediction. Each
    # ratio is the expected fraction of a summarized block's input tokens that
    # the summary occupies; they seed an EWMA refined after each real
    # compaction. The forecast only affects the predicted reclaim number shown
    # in the compact menu — never strategy availability (an exact verdict).
    # 0/unset falls back to sp4rk's defaults (0.3 / 0.15 / 0.3).
    forecast:
      summarization_ratio: 0.3 # summarization + hierarchical middle zone
      hierarchical_distant_ratio: 0.15 # hierarchical distant zone (one aggressive summary)
      hierarchical_middle_ratio: 0.3 # hierarchical middle zone (per-block summaries)

  # --- Tool Result Budget ---------------------------------------------------
  tool_result_budget:
    hard_cap_tokens: 4096 # Absolute max tokens per tool result
    max_fill_fraction: 0.3 # Max fraction of available context space
    cacheTTLSeconds: 300 # TTL in seconds for MCP tool cache entries

  # --- Tool Output Pruning --------------------------------------------------
  toolOutputPruning:
    keepLastN: 3 # Recent tool outputs to keep intact (role-based per-step defaults override this)
    protectedTools: ["store_fact", "search_facts"] # Tools whose outputs are never pruned
    thresholdPercent: 50 # Context fill % below which pruning is skipped entirely (0 = always prune)

  # --- History Mutation (regular, non-emergency) ----------------------------
  # Reduces O(n²) replay cost by replacing old tool results with cache
  # references. Information is preserved via ToolResultCache — the LLM can
  # retrieve evicted content via tool_result_read. Independent of emergency
  # compaction (which triggers at fill % thresholds).
  historyMutation:
    toolResultEvictionStep: 10 # Evict tool results to cache refs after N steps (0 = disabled)
    evictStepStatus: false # Evict update_checklist results immediately (pure bookkeeping)
    dedupRepeatedReads: false # Replace duplicate file reads with cache reference

  # --- Circuit Breaker (loop protection) ------------------------------------
  # Thresholds calibrated against real-session telemetry. Mutating tools
  # (write_file, edit_file, create_directory, delete_file, delete_directory)
  # and meta-tools (update_checklist, set_step_status, store_fact) are excluded
  # from the fruitless and same-tool-repeat detectors — their short, similarly-
  # sized successful results are legitimate in bursts (e.g. batch file edits
  # each returning "successfully edited file"). Thresholds below apply only to
  # exploration/search tools where consecutive short results indicate a stuck
  # loop.
  circuitBreaker:
    repeatNudgeThreshold: 3 # Identical tool calls before nudge
    repeatAbortThreshold: 5 # Identical tool calls before abort
    truncationAbortThreshold: 3 # Consecutive truncated responses before abort
    parseErrorAbortThreshold: 3 # Consecutive parse errors before abort
    fruitlessNudgeThreshold: 5 # Fruitless tool calls before nudge
    fruitlessAbortThreshold: 8 # Fruitless tool calls before abort
    fruitlessMaxResultLen: 48 # Max result length to consider fruitless
    sameToolRepeatNudgeThreshold: 8 # Same tool repeated calls before nudge
    sameToolRepeatAbortThreshold: 12 # Same tool repeated calls before abort
    sameToolResultSizeDelta: 128 # Result size delta for same-tool detection

# ---------------------------------------------------------------------------
# Security & Tool Access Policies
# ---------------------------------------------------------------------------
security:
  # LLM-based safety judge (used on-demand via "Ask agent" button)
  judge:
    model: "" # Model override for judge calls (empty = use default)

  # When true, file write tools (write_file, edit_file, delete_file,
  # delete_directory, create_directory) execute without confirmation when
  # all paths in their input are within the session roots — the workspace,
  # the session temp directory, and any additional working directories
  # (all treated as equal peers). Symlink traversals that resolve out of
  # session roots are still forced to confirmation regardless.
  # Default: false. Set to true if you prefer convenience over safety for
  # write operations within your own projects.
  auto_approve_workspace_writes: false

  # Autonomy mode — the unified autonomy posture (security.autonomy_mode),
  # replacing the former pair of boolean keys: the Smart Approve toggle and
  # the silent-mode master switch. Values:
  #   standard (default) — every interactive prompt (tool confirmations,
  #                        step-limit cards, ask_user, review prompt) reaches
  #                        a human.
  #   assisted           — a strict OWASP ASI (ASI01–ASI10) LLM judge
  #                        automatically evaluates every escalated call —
  #                        whether it comes from an effective user_confirm
  #                        policy or from a hard safety reason surfaced by an
  #                        allow-group tool — after all deterministic gates
  #                        and workspace auto-approval above. This is the
  #                        unified confirmation funnel: there is no separate
  #                        bypass path for hard reasons.
  #                          - A strict ALLOW executes without UI.
  #                          - CONFIRM, judge errors, timeouts, and
  #                            unparseable responses always fall back to
  #                            manual confirmation (the "Ask Agent" button
  #                            is hidden because the strict judge already
  #                            evaluated the call).
  #                          - HARD reasons (a fired security control:
  #                            command blocklist, SSRF escape, symlink
  #                            escape out of the session roots; or an
  #                            unassessable input: degraded SSRF protection,
  #                            an undeterminable URL/path) always consult
  #                            the strict judge, even for allow-group tools.
  #                          - Deterministic backstop: a canonical hard
  #                            reason — a fired control (blocklist, SSRF,
  #                            symlink escape) or an unassessable input —
  #                            can never be auto-approved by the strict
  #                            judge in assisted mode (the silent judge
  #                            terminal below is the one deliberate
  #                            exception, where your delegation makes the
  #                            judge's ALLOW final); canonicality is matched
  #                            by typed reason codes (JudgeOutcome.ReasonCode,
  #                            an sp4rk contract), not by prose. An ALLOW
  #                            verdict is overridden to CONFIRM, so the user
  #                            still decides.
  #                        deny groups are never judged (always blocked).
  #   silent             — unattended operation: the four silent_mode
  #                        sub-policies below resolve the prompts that would
  #                        otherwise need a human, so a task can run to
  #                        completion without blocking. The former
  #                        silent-mode master switch no longer exists — this
  #                        value IS the master switch for the sub-policies.
  # Configs written before this enum are migrated at load (silent wins over
  # assisted) and the legacy keys are dropped at the next save. An unknown
  # value fails safe to standard with a load warning. The posture is pinned
  # per task at launch (a fresh send or any resume): a Settings save updates
  # the shared state immediately but never flips the posture of a task that
  # is already running — the next task (or a resumed one) picks it up.
  autonomy_mode: "standard"

  # --- Silent mode (security.silent_mode) ---
  # The sub-policies of the unattended-operation posture. They are live only
  # while security.autonomy_mode is "silent" (the master switch above — the
  # former enabled key no longer exists); in every other mode each sub-policy
  # is inert and the app behaves exactly as before. When live, the three
  # sub-policies resolve the prompts that would otherwise need a human, so a
  # task can run to completion without blocking:
  #   tool_confirm.mode  — a tool call that would open a confirmation card.
  #                        "judge" (default) routes it through the strict
  #                        OWASP ASI judge, whose decision is FINAL: a strict
  #                        ALLOW runs — canonical hard reasons included (you
  #                        delegated the final decision to the judge; the
  #                        executed decision is audited in the
  #                        autonomy_decision event with the judge's
  #                        justification); a DENY, CONFIRM, a missing/failing
  #                        judge, or an unparseable verdict denies; "allow"
  #                        runs every confirmation-gated call with no hard
  #                        reason (a hard reason still escalates to the
  #                        judge); "deny" blocks them all.
  #   step_limit.mode    — a step-budget / circuit-breaker boundary. "auto"
  #                        (default) lets the strict judge decide from the
  #                        trajectory (allow_once / allow_more / allow_always /
  #                        deny); a fixed value pins that response without the
  #                        judge; "stop" keeps the interactive card (opts this
  #                        gate out of silent mode).
  #   ask_user.mode      — the ask_user tool. "disable" (default) registers
  #                        it in a disabled form that reports the tool as
  #                        unavailable, so the agent can never block on a
  #                        question; "enable" keeps it fully available.
  # (A former fourth sub-policy for the post-task code-review prompt was
  # removed together with that prompt — it fired on nearly every task; a
  # config still carrying the stale key loads with it ignored.)
  # Every automatic decision (a tool_confirm / step_limit prompt resolved
  # without a human) is recorded as a persisted, non-blocking
  # `autonomy_decision` event (kind, mode, policy, verdict, tool/reason,
  # justification), so an unattended run stays auditable (OWASP ASI10). Silent
  # mode only replaces the human
  # answer to a prompt — it never weakens a gate: deny groups, path
  # containment, symlink/flowsh analysis and workspace auto-approval are
  # unchanged, and a call carrying a hard safety reason is never auto-executed
  # without the judge (allow mode escalates it; judge mode lets the judge
  # decide, and the judge's ALLOW is final — the ONE deliberate exception to
  # the assisted-mode canonical backstop, which forces a confirmation card
  # instead). Pick tool_confirm "deny" if you want a judge-free hard floor for
  # unattended runs.
  # A runtime change from Settings → Security takes effect without an app
  # restart: sub-policy edits apply at each task's launch (a running task
  # keeps the posture it started with; the next fresh or resumed task picks
  # up the current values), and ask_user follows Settings immediately.
  silent_mode:
    tool_confirm:
      mode: "judge"
    step_limit:
      mode: "auto"
    ask_user:
      mode: "disable"

  # Repositories whose "untrusted git configuration" intake warning has been
  # dismissed via the toast's "Trust this repo" action (also manageable from
  # Settings → Security → Trusted repos). Each entry is a mapping with an
  # absolute repository-root `path` (matching is exact, after cleaning) and an
  # optional `fingerprint` — the hash of the git-config snapshot captured when
  # the repository was trusted (snapshots live under ~/.c0wrk/git-config-snapshots/),
  # used to detect config drift after the trust decision. A bare path string
  # (the legacy pre-fingerprint format) is also accepted and loads as a path
  # with no fingerprint. Default: empty (every suspicious .git/config warns
  # once per open).
  # trusted_git_repos:
  #   - path: /Users/you/work/my-legit-lfs-repo
  #     fingerprint: a1b2c3d4

  # Repositories that are ALWAYS treated as hardened: their intake warning is
  # never suppressed and they are excluded from the trusted list (a root cannot
  # appear in both lists). Each entry is an absolute repository-root path;
  # matching is exact (after cleaning). Default: empty.
  # harden_git_repos:
  #   - /Users/you/work/untrusted-download

  # --- Tool security groups (security.groups) ---
  # Policies are configured per tool GROUP, not per tool name. Every tool
  # belongs to exactly one group:
  #   local_read   — read-only local filesystem tools (read_file, glob,
  #                  ripgrep, list_directory).                    Default: allow
  #   remote_read  — read-only remote access (web_search, web_fetch).
  #                                                                Default: allow
  #   execute      — shell execution (bash_exec, posh_exec). The only group
  #                  that supports a command blocklist. Default: user_confirm
  #   local_write  — local filesystem writes (write_file, edit_file,
  #                  delete_file, create_directory, delete_directory).
  #                                                 Default: user_confirm
  #   local_mcp    — MCP servers launched locally over the stdio transport.
  #                                                 Default: user_confirm
  #   remote_mcp   — MCP servers reached over the network (http transport).
  #                                                 Default: user_confirm
  #   remote_write — tools that mutate remote resources (e.g. remote MCP
  #                  mutations).                     Default: user_confirm
  # Policy values: "allow" | "user_confirm" | "deny". A group omitted here
  # keeps its default policy (reads: allow; mutations: user_confirm); the
  # registry additionally fails safe to user_confirm for any group that has
  # no configured entry at all.
  groups:
    local_read:
      policy: "allow"
    remote_read:
      policy: "allow"
    execute:
      policy: "user_confirm"
      # The execute blocklist applies to every shell command (bash_exec and
      # posh_exec alike). It is EMPTY by default and purely a user-authored
      # extension — the app ships no predefined patterns, so the posture out
      # of the box is the group policy above plus the shell tool's own
      # dialect safety checks. Each entry is an RE2 regex; a matching command
      # is forced to confirmation regardless of policy. Patterns compile into
      # BOTH shell dialects, so keep them dialect-neutral and prefix
      # PowerShell-specific patterns with (?i) (PowerShell is
      # case-insensitive). An explicitly empty list (`blocklist: []`) and an
      # omitted key mean the same thing: no patterns.
      # MIGRATION NOTE: this key was renamed from `blacklist`. A legacy
      # `blacklist:` list that you had customized is carried over to
      # `blocklist` automatically at load and persisted under the new key at
      # the next save; a legacy list identical to the old shipped default (or
      # a missing one) is dropped — the effective blocklist is empty either
      # way.
      # RECOMMENDED PERSONAL FLOOR (optional): under policy "allow" the only
      # deterministic floor is the flowsh shell-analysis criteria, and a few
      # shapes deliberately have NO criterion — they surface to the judges
      # only under a confirming policy, so on "allow" they run silently
      # unless you add a pattern. Examples for the known gaps:
      #   - 'sudo\s+'
      #   - '\b(shutdown|reboot|halt|poweroff)\b'
      #   - '(^|[\s;&|])git\s+(push|reset\s+--hard|clean\s+-[fdx])'
      # blocklist:
      #   - 'rm\s+-rf\s+/'
      #   - 'mkfs'
    local_write:
      policy: "user_confirm"
    local_mcp:
      policy: "user_confirm"
    remote_mcp:
      policy: "user_confirm"
    remote_write:
      policy: "user_confirm"

  # --- Indirect prompt injection defense ---
  # Content from untrusted external tools (web_search, web_fetch, bash_exec,
  # ripgrep, glob, read_file, MCP) is wrapped in <untrusted-content> XML tags
  # before entering the LLM context. The system prompt instructs the LLM to
  # treat tagged content as data, not instructions.
  injection_defense:
    enabled: true # Always-on in current implementation (no runtime gating)

# ---------------------------------------------------------------------------
# Web Search
# ---------------------------------------------------------------------------
search:
  provider: "tavily" # Web search provider
  api_key: "${TAVILY_API_KEY}"

# ---------------------------------------------------------------------------
# Tool Output Limits
# ---------------------------------------------------------------------------
toolLimits:
  # File read limits
  readDefaultLines: 2000 # Max lines returned per read_file call (default window when no range specified)

  # Search limits
  webSearchMaxResults: 5 # Max web search results

  # --- Per-tool Stage 1 truncation (applied before token budget) ------------
  # These limits trigger output fragmentation: when tool output exceeds the
  # limit, it is truncated and a nudge with a cache hash is appended so the
  # LLM can read the full result in fragments via tool_result_read.
  # Set conservative values here so fragmentation activates for realistic
  # large-output scenarios (e.g. reading files >2000 lines).
  # Omitted tools receive no Stage 1 truncation. Use 0 to disable a dimension.
  #
  # Note: read_file uses a streaming reader (O(1) memory) that caps output at
  # read time via MaxWindowLines (50000, hardcoded). The maxLines value below
  # is a secondary safety net on the already-windowed output. The primary cap
  # is readDefaultLines (the default window size).
  #
  # Lowering these limits increases fragmentation frequency and thus LLM call
  # count (each fragment read costs an extra tool-call iteration), but reduces
  # memory and context overhead per individual tool result. Balance these
  # values based on your typical file sizes and available context window.
  perToolTruncation:
    read_file:
      maxLines: 2000 # secondary; primary cap is the streaming reader window
    read_attachment:
      maxLines: 2000 # in-memory markdown attachments; Stage 1 fragmentation parity with read_file
    ripgrep:
      maxLines: 2000
    glob:
      maxLines: 2000
    list_directory:
      maxLines: 2000
    web_fetch:
      maxBytes: 2097152  # 2 MiB
    bash_exec:
      maxLines: 5000
    posh_exec:
      maxLines: 5000

# ---------------------------------------------------------------------------
# Timeouts (in seconds)
# ---------------------------------------------------------------------------
timeouts:
  bashMaxTimeout: 120 # Max execution time for bash commands
  bashWaitDelay: 5 # Wait delay for bash process cleanup
  ripgrepTimeout: 60 # Timeout for ripgrep searches
  webFetchTimeout: 30 # Timeout for web page fetching
  webFetchProxyTimeout: 30 # Timeout for web page fetching when the proxy is enabled. 0 = use default 30s
  webFetchRetries: 2 # Retries for failed web page fetches; each retry doubles the active timeout (webFetchTimeout, or webFetchProxyTimeout when proxy is on). 0 = use default 2
  webSearchTimeout: 30 # Timeout for web search queries
  persistenceTimeout: 5 # Timeout for persistence (DB) operations
  llmRequestTimeout: 600 # Timeout for a single LLM API call in the main chat loop (10 min). 0 = use default 600s
  serviceLLMRequestTimeout: 120 # Timeout for one-shot "service" LLM requests (session title, commit message, prompt optimization) (2 min). 0 = use default 120s
  # Timeout for the git commit spawn (git hooks, GPG signing, or large repos
  # can hold a commit open for a long time). Applies only to the commit
  # command itself; quick git probes (rev-parse and friends) keep the fast
  # 30s timeout. 0 / omitted = use default 300s (5 min).
  # gitCommitTimeout: 300

# ---------------------------------------------------------------------------
# Shell Execution Override
# ---------------------------------------------------------------------------
# Overrides HOW the platform shell-execution tool launches the agent's
# command — bash_exec on Linux/macOS, posh_exec on Windows (exactly one is
# live per platform; only that tool's entry is read). The built-in launch
# shapes are `bash -c <command>` and
# `powershell.exe -NoProfile -NonInteractive -Command <command>`.
#
# command is an argv TEMPLATE: exactly one element must be the "{command}"
# placeholder — it is replaced by the agent's command as a SINGLE argv
# element (no string splicing, no extra quoting). The first element is the
# binary (absolute path or PATH name). Examples:
#
#   command: ["/opt/homebrew/bin/bash", "-c", "{command}"]   # Homebrew bash 5
#   command: ["/bin/zsh", "-c", "{command}"]                 # system zsh
#   command: ["pwsh.exe", "-NoProfile", "-Command", "{command}"]  # Windows pwsh
#
# shell declares WHICH shell the command text is written in — the agent
# prompts, the deterministic command-safety analysis (flowsh dialect), and
# the PowerShell-specific output bootstrap all follow it. CLOSED enum:
#   bash-family: bash, sh, zsh, ksh, dash
#   PowerShell-family: powershell, pwsh
# Shells the safety analysis cannot parse (fish, nushell, csh, cmd.exe, …)
# are NOT supported and are rejected at load. An omitted shell is seeded
# with the tool's native family (bash / powershell); an INVALID entry is
# fail-soft: a load warning is surfaced and the built-in launch shape is
# kept. Security gates (execute-group policy, blocklist, flowsh criteria
# C1–C10, confirmation funnel) are unaffected — the override changes how a
# command is launched, never what is checked.
#
# shell_exec:
#   bash_exec:
#     command: ["/opt/homebrew/bin/bash", "-c", "{command}"]
#     shell: bash
#   posh_exec:
#     command: ["pwsh.exe", "-NoProfile", "-Command", "{command}"]
#     shell: pwsh

# ---------------------------------------------------------------------------
# Orchestration Limits
# ---------------------------------------------------------------------------
orchestration:
  maxDependencyContextChars: 8000 # Max chars for dependency context injection
  maxSummaryLength: 500 # Max summary length in characters
  maxJudgeCacheSize: 1000 # Max entries in judge decision cache
  # Maximum recursive delegation depth when allow_redelegate is true (ASI07-R6).
  # Limits how deeply a subagent may delegate further. 0 = use default (2).
  maxRedelegationDepth: 2

# ---------------------------------------------------------------------------
# Goal Loop
# ---------------------------------------------------------------------------
# Controls the goal-derivation / verification loop. verification gates the
# independent verifier turn that confirms task completion before success:
#
#   independent  (default) — the loop runs an independent verifier turn.
#   off                    — the verifier is disabled; the loop relies solely
#                            on the agent's own declare_goal_status verdict.
#
# goal_loop:
#   verification: independent

# ---------------------------------------------------------------------------
# Workspace Ignore Files (.gitignore / .aiignore)
# ---------------------------------------------------------------------------
# c0wrk respects repository ignore files to decide which files and directories
# are excluded from the file tree view and the vector index:
#
#   - .gitignore  — standard git ignore rules, consulted for every project.
#   - .aiignore   — optional, AI-specific ignores layered on top of
#                   .gitignore. Use it to hide files that git tracks but the
#                   agent/indexer should not see (e.g. generated reports,
#                   vendored snapshots).
#
# Recommended .aiignore recipe (files git tracks but the agent rarely needs):
#
#   go.sum
#   package-lock.json
#   *.lock
#
# Hidden directories (entries starting with '.') are always excluded regardless
# of ignore files. There is no per-key workspace configuration: control what is
# indexed by editing .gitignore / .aiignore at the project root.

# ---------------------------------------------------------------------------
# Vector Index / Hybrid Search
# ---------------------------------------------------------------------------
# Controls whether the vector index operates in hybrid (vector + BM25)
# or vector-only mode. When hybrid is true (the default), the service
# writes each chunk to both chromem (embeddings) and bleve (BM25), and
# queries fuse the ranked lists with Reciprocal Rank Fusion (k=60).
#
# Set hybrid: false to disable lexical search entirely — the bleve
# directory will still be opened but never consulted at query time.
#
# Hybrid RRF tuning knobs (all optional; omitted values use built-in
# defaults). These control how the vector and lexical ranked lists are
# fused into a single result set.
#
#   hybrid_rrf_k: 60
#     Reciprocal Rank Fusion constant k. Lower k makes top ranks weigh
#     more (steeper curve); higher k flattens the curve. 60 is the
#     conventional default (Cormack/Clarke/Buettcher, TREC 2009).
#
#   hybrid_fanout_multiplier: 4
#     Per-side candidate pool = max(topK * multiplier, fanout_min). A
#     larger pool improves recall but feeds more noise into RRF.
#
#   hybrid_fanout_min: 100
#     Minimum per-side fanout, applied when topK * multiplier is small.
#
# Pre-fusion score thresholds (suppress noise-tail promotion). Hits
# below these cutoffs are discarded BEFORE RRF fusion, so weakly
# semantic chunks that merely contain a query term cannot earn a double
# RRF boost and jump above genuinely relevant one-sided hits. Set a
# threshold to 0 to disable it.
#
#   hybrid_vector_score_floor: 0.0
#     Absolute cosine-similarity floor. Vector hits with similarity
#     below this value are discarded before fusion. 0 disables the
#     absolute floor (default).
#
#   hybrid_vector_score_ratio: 0.25
#     Relative cosine cutoff. A vector hit is discarded when its
#     similarity is below ratio × top similarity among the post-filter
#     vector hits. 0.25 keeps hits within 25% of the best match.
#
#   hybrid_lexical_score_ratio: 0.1
#     Relative BM25 cutoff. A lexical hit is discarded when its BM25
#     score is below ratio × top BM25 among the post-filter lexical
#     hits. BM25 magnitudes vary widely across queries, so a relative
#     threshold is more robust than an absolute one.
#
# Embedding thread pool (ONNX intra-op). Controls how many threads the
# embedding model may use during (re)indexing. Unset or 0 = all cores
# (legacy default, maximum throughput but a CPU spike). Set it to cap
# CPU usage at the cost of indexing speed:
#
#   embedding_threads: 0   # all cores (default; legacy behaviour)
#   embedding_threads: 1   # minimum CPU load, slowest indexing
#   embedding_threads: 2   # balance between quiet operation and speed
#
# Note: this caps only the ONNX intra-op thread pool — i.e. the vector
# (embedding) side of the index. The lexical/BM25 side is pure Go and
# unaffected by this knob.
#
# Embedding execution provider (GPU support). The embedding model runs on
# the ONNX Runtime; this selects which execution provider (device class)
# it uses:
#
#   execution_provider: auto  # default (also what an unset/empty value
#                             # normalizes to): try the NVIDIA CUDA
#                             # provider and fall back to the CPU provider
#                             # when CUDA is not usable. When the CUDA
#                             # attempt fails, a WARN is logged and
#                             # indexing/search continues on the CPU —
#                             # never a hard failure and never a silent
#                             # switch.
#   execution_provider: cpu   # always run on the CPU provider.
#   execution_provider: cuda  # run on an NVIDIA GPU via the CUDA
#                             # execution provider. If CUDA cannot come
#                             # up (no GPU build, no driver, bad device
#                             # id), the vector index falls back to the
#                             # CPU provider so search stays available —
#                             # but loudly: a WARN log, a dismissable
#                             # runtime-error toast (error_code
#                             # "vector_cuda_fallback"), and the
#                             # requested-vs-effective provider mismatch
#                             # recorded in every vector-index status
#                             # payload. The fallback is never silent.
#
#   device_id: 0              # GPU index used when the CUDA provider is
#                             # active (default 0 = the first GPU, which
#                             # is what most machines want; ignored by
#                             # the CPU provider). Must be >= 0.
#
# GPU requirements — "auto" and "cuda" only use the GPU when a CUDA-
# enabled ONNX Runtime build sits next to the executable (the standard
# `make build` / `make fetch-onnx` downloads the CPU-only build; fetch
# the GPU variant with `make fetch-onnx-gpu`, Linux x64 only — or
# install the release archive
# `c0wrk-desktop-linux-amd64-cuda13.tar.gz`, which bundles the GPU
# flavor). The GPU build additionally needs an NVIDIA driver and the
# CUDA 13 runtime (`libcudart.so.13`, cuBLAS, cuRAND) plus the CUDA
# provider libraries that ship beside the runtime library. On any other
# platform, or with the CPU build in place, "auto" quietly resolves to
# the CPU provider. The in-app updater always updates within the same
# flavor — a cuda13 install receives cuda13 archives and vice versa
# (switching flavors is a manual reinstall).
#
# Changing either knob requires an app restart: the provider is chosen
# once when the embedder is created at startup and the ONNX session is
# not re-created afterwards. Values are validated at config load — an
# unknown execution_provider or a negative device_id is a load error.
#
# Indexing throughput / latency knobs:
#
#   embedding_batch_size: 32   # rows per ONNX batch inference (default).
#                              # Larger batches amortize inference across more
#                              # chunks (higher indexing throughput up to the
#                              # measured plateau) but linearly grow the
#                              # per-inference output tensor (~1 MiB per row)
#                              # and single-call latency. 32 sits at the knee
#                              # of the measured throughput curve; lower it on
#                              # memory-constrained machines.
#
#   embedding_cache_max_bytes: 536870912
#                              # per-project disk cap for content-addressed
#                              # embeddings (default 512 MiB). The cache lives
#                              # inside vector_index/embedding_cache and is
#                              # shared by branches, renames, and moved files.
#                              # Negative disables it; 0/unset uses default.
#
#   prep_workers: 2            # parallel file-preparation workers
#                              # (read/hash/chunk) overlapping ONNX inference
#                              # in the indexing pipeline (default 2). 1
#                              # reproduces the historical serial behaviour;
#                              # embedding itself stays single-threaded under
#                              # the service write lock regardless.
#
#   debounce_ms: 1000          # watcher debounce window in milliseconds
#                              # (default 1000, the historical value). Bursts
#                              # of file-change events coalesce into a single
#                              # incremental index pass after this quiet
#                              # period. Lower = fresher index but more passes
#                              # during active editing; higher = fewer passes.
#                              # Unchanged files are detected by a stat
#                              # fast-path (size + mtime) without re-reading
#                              # or re-hashing them; this is heuristic — a
#                              # rewrite preserving both (archive extraction
#                              # restoring mtimes, some sync tools) escapes
#                              # it — so every 20th validation pass re-reads
#                              # and re-hashes everything as a backstop.
#
#   chunk_overlap: 200         # characters of overlap between adjacent chunks
#                              # (default 200, the historical value). Higher
#                              # overlap improves recall at chunk boundaries
#                              # but increases the number of embedded chunks
#                              # (and thus indexing time/memory). Changing
#                              # this (or max_chunk_size) is picked up
#                              # automatically: sidecar entries record the
#                              # chunker configuration they were produced
#                              # under, and the next incremental pass re-
#                              # indexes affected files — no manual Reindex
#                              # needed.
#
# Content filter (early skip of generated/minified/pathological files):
#
#   content_filter:
#     enabled: true              # master switch (default true). Deterministic
#                                # content-based skip BEFORE chunking, so
#                                # filtered files cost no chunks, no
#                                # embeddings, no inference. Runs on top of
#                                # the existing ignore rules and hard limits
#                                # (max_file_size / max_chunks_per_file are
#                                # unaffected and still enforced). Exact
#                                # path-level control remains available via
#                                # .aiignore.
#     detect_generated: true     # skip files whose header (first 2 KiB)
#                                # carries a canonical "code generated ...
#                                # DO NOT EDIT" marker (default true).
#     detect_minified: true      # skip files that are at least 16 KiB, have
#                                # a line longer than 10 KiB, and whose
#                                # whitespace share is at most 8% — the
#                                # minified-bundle signature (default true).
#     detect_pathological: true  # skip files of at least 32 KiB containing a
#                                # single unbroken token longer than 24 KiB —
#                                # embedded blobs/base64 dumps (default true).
#     generated_header_bytes: 2048
#     minified_min_bytes: 16384
#     minified_max_line_bytes: 10240
#     minified_max_whitespace_ratio: 0.08
#     pathological_min_bytes: 32768
#     pathological_max_token_bytes: 24576
#                                # numeric thresholds (defaults shown); every
#                                # heuristic requires a strong signal, and a
#                                # false skip is recoverable by raising the
#                                # relevant threshold or flipping its detect_
#                                # flag. Changing ANY of these knobs changes
#                                # the chunker fingerprint, so the next
#                                # incremental pass re-evaluates affected
#                                # files automatically: newly excluded files
#                                # have their documents removed, newly
#                                # included files are (re)indexed, and
#                                # unchanged re-chunks hit the embedding
#                                # cache instead of ONNX.
#
# Search readiness bound:
#
#   search_wait_timeout_ms: 3000
#                              # how long a consumer may WAIT for the vector
#                              # index to become ready — e.g. right after a
#                              # project switch while the initial pass is
#                              # still running (default 3000). An explicit
#                              # 0 means "fail fast": never wait, serve
#                              # immediately with whatever is indexed.
#                              # Unset resolves to 3000; 0 is preserved as a
#                              # deliberate sentinel, not defaulted. The
#                              # bound covers readiness waiting exactly once
#                              # per consumer: the semantic_search tool waits
#                              # in its dedicated wait step (the search itself
#                              # never waits), RAG hints call wait+search
#                              # under one shared deadline, and the
#                              # SearchVectorStore RPC bounds its single
#                              # call. Query execution is separately bounded
#                              # by the same value as defense-in-depth.
#
# Project parking (return-to-project latency vs. RAM):
#
#   park_capacity: 3           # how many recently-closed projects keep their
#                              # vector-index state resident in RAM (default
#                              # 3). Opening a project synchronously
#                              # gob-decodes every branch document into memory
#                              # and reopens the bleve lexical index — the
#                              # dominant project-switch cost. Parking keeps
#                              # that state alive so returning to a recent
#                              # project restores it instantly and only
#                              # re-indexes files that changed while away
#                              # (IndexIncremental). Tradeoff: each parked
#                              # project holds its full vector + lexical index
#                              # in memory — raise this on a RAM-rich machine
#                              # to make frequent project hopping instant,
#                              # lower it (or set 0) on a constrained one.
#                              # 0 disables parking: every switch reopens the
#                              # persistent DB from scratch (the historical
#                              # behaviour). Negative is treated as 0.
#
#   park_budget_mb: 1024       # cumulative RAM budget (MiB) for ALL parked
#                              # states (default 1024). Right after a state
#                              # is parked, the OLDEST parked states are
#                              # evicted — sidecar flushed, freed RAM nudged
#                              # back to the OS — while the summed ESTIMATED
#                              # footprints exceed the budget. The estimate
#                              # is documents × (embedding dims × 4 B +
#                              # 1 KiB): coarse, but proportional to the true
#                              # vector + lexical footprint, so a few huge
#                              # indexes stop monopolizing the LRU at the
#                              # expense of many small ones. The effective
#                              # bound is min(park_capacity, park_budget_mb).
#                              # -1 disables the byte budget (park_capacity
#                              # alone); 0 is rejected at load as ambiguous and
#                              # values below -1 are rejected as typos (only -1
#                              # disables); park_capacity: 0 still disables
#                              # parking entirely regardless of the budget.
#
#   max_chunks_per_file: 4000  # upper bound on chunks one file may contribute
#                              # to an index pass (default 4000). Files that
#                              # exceed it are skipped wholesale (WARN) — a
#                              # backstop against data-format files (BPE
#                              # vocab/merges, minified assets, lockfiles)
#                              # that would otherwise hang/OOM the embedder.
#
# Not exposed (deliberate): the embedding model's MaxSeqLength (512) and
# HiddenDim (512) are fixed properties of the bundled jina-v2-small model —
# changing them without swapping the model only produces wrong embeddings,
# so they are not user-configurable knobs.
# File-size and chunk-size limits:
#
#   max_file_size: 4194304   # 4 MiB (default). Files larger than this are
#                            # skipped before being read into memory for
#                            # chunking/embedding. Necessary because the NUL-
#                            # byte binary check cannot recognize every binary
#                            # format (ONNX/safetensors protobufs have readable
#                            # ASCII headers with no NUL), so without this limit
#                            # a multi-hundred-MB model file would be loaded
#                            # whole and explode memory. Raise it if legitimate
#                            # large source files are excluded from search;
#                            # lower it to bound memory on constrained machines.
#
#   max_chunk_size: 1500     # characters (default). Maximum chunk size passed
#                            # to the chunker. Sized to fit the embedding
#                            # model's context window (MaxSeqLength 512 tokens).
#                            # Raising it significantly risks producing chunks
#                            # the model cannot embed in a single pass.
#
# vector_index:
#   hybrid: true
#   hybrid_rrf_k: 60
#   hybrid_fanout_multiplier: 4
#   hybrid_fanout_min: 100
#   hybrid_vector_score_floor: 0.0
#   hybrid_vector_score_ratio: 0.25
#   hybrid_lexical_score_ratio: 0.1
#   embedding_threads: 0
#   execution_provider: auto
#   device_id: 0
#   embedding_batch_size: 32
#   embedding_cache_max_bytes: 536870912
#   prep_workers: 2
#   debounce_ms: 1000
#   chunk_overlap: 200
#   search_wait_timeout_ms: 3000
#   park_capacity: 3
#   park_budget_mb: 1024
#   max_file_size: 4194304
#   max_chunk_size: 1500
#   max_chunks_per_file: 4000
#   content_filter:
#     enabled: true
#     detect_generated: true
#     detect_minified: true
#     detect_pathological: true
#     generated_header_bytes: 2048
#     minified_min_bytes: 16384
#     minified_max_line_bytes: 10240
#     minified_max_whitespace_ratio: 0.08
#     pathological_min_bytes: 32768
#     pathological_max_token_bytes: 24576

# ---------------------------------------------------------------------------
# Proxy — HTTP/HTTPS proxy for all outbound connections.
# ---------------------------------------------------------------------------
# When enabled, all LLM requests, web_search, web_fetch, MCP HTTP transports,
# and model registry calls go through this proxy. Hosts in bypass_list connect
# directly. The tls_cert_dir (optional) adds custom CA certificates for TLS
# verification through the proxy (e.g., corporate MITM proxy root CA).
#
# proxy:
#   enabled: false
#   url: "http://user:password@proxy.corp.local:8080"
#   bypass_list:
#     - localhost
#     - 127.0.0.1
#   tls_cert_dir: ""  # /path/to/custom/ca-certs
#   set_global_env: true  # Export HTTP_PROXY/HTTPS_PROXY/NO_PROXY/SSL_CERT_DIR
#                         # for subprocesses (bash_exec, MCP stdio servers).
#                         # Default: true. Set to false to prevent proxy state
#                         # from leaking into third-party libraries that read
#                         # env vars at init time.

# ---------------------------------------------------------------------------
# Experimental Features
# ---------------------------------------------------------------------------
# Master switch for features that are still under active development. It is
# all-or-nothing: enabling it exposes every gated feature, disabling it hides
# every gated feature and treats each as off. Gated features today:
#   - the E2S explicit-state execution mode (e2s.*)
#
# experimental:
#   # Master switch. Default: false (E2S mode off).
#   enabled: false

# ---------------------------------------------------------------------------
# Updates — automatic "check for updates"
# ---------------------------------------------------------------------------
# Controls the self-update subsystem. All update configuration lives here —
# there is no separate user-preference file.
#
# updates.enabled is the master switch for the entire subsystem (operator
# level). updates.auto_check narrows the automatic background check only: when
# false the app never polls on startup, but manual checks from the UI still
# work (provided enabled is true).
#
# When updates.enabled is false: CheckForUpdates reports no update, the
# background auto-check never runs, and the UI disables all update affordances.
#
# The check is best-effort and never blocks or breaks startup: network errors
# are swallowed silently. The timestamp of the last check (and the currently-
# skipped version) are persisted to ~/.c0wrk/update_state.json, NOT here — this
# file only configures the toggles and the cadence.
#
# updates:
#   # Master switch for the whole update subsystem. Default: true. When false
#   # the app never auto-checks on startup AND manual checks report no update.
#   enabled: true
#   # Whether to poll for updates automatically on startup. Default: true.
#   # When false only the automatic background check is suppressed — manual
#   # checks from the UI still work. Also settable from the Settings UI (the
#   # toggle writes straight back into this file). NOTE: saving from the UI
#   # re-serializes the ENTIRE config.yaml — any hand-written comments in the
#   # file are dropped. ${VAR} environment references are preserved as-is (they
#   # are expanded only at load time).
#   auto_check: true
#   # Minimum time between automatic checks, as a duration string parsed by
#   # time.ParseDuration (e.g. "6h", "30m", "24h"). Default: "6h". An
#   # unparseable value falls back to 6h.
#   check_interval: "6h"

# ---------------------------------------------------------------------------
# Git — automatic background fetch
# ---------------------------------------------------------------------------
# Controls every AUTOMATIC fetch the app performs in the background: on app
# startup, on project switch, on window focus, and on a periodic ticker.
# Manual fetches triggered from the Git panel are never gated by this section.
#
# git.auto_fetch is the master switch for ALL automatic fetch triggers. When
# false, no automatic fetch ever runs (startup, switch, focus, and ticker are
# all suppressed); manual fetch from the UI still works.
#
# git.auto_fetch_interval tunes ONLY the periodic ticker cadence. The special
# value "0" disables just the ticker — the event-driven triggers (startup,
# project switch, window focus) remain active as long as auto_fetch is true.
#
# git:
#   # Master switch for all automatic fetch triggers (startup, project
#   # switch, window focus, periodic ticker). Default: true. When false no
#   # automatic fetch ever runs; manual fetches from the Git panel are
#   # unaffected.
#   auto_fetch: true
#   # Period of the background fetch ticker, as a duration string parsed by
#   # time.ParseDuration (e.g. "2m", "30s", "5m"). Default: "2m". Set to "0"
#   # to disable ONLY the periodic ticker — the event-driven triggers
#   # (startup, switch, focus) stay on. An unparseable value falls back to
#   # the default.
#   auto_fetch_interval: "2m"

# ---------------------------------------------------------------------------
# Model Profiles (model_profiles)
# ---------------------------------------------------------------------------
# Optimizations applied when running on a local or mid-size (roughly 10–35B-
# parameter) LLM. Only TWO durable choices live in this section: the MANUAL-ONLY master
# toggle (no auto-detection; normally flipped from the Settings UI) and the
# active profile id. The 25 variant knobs
# (essential_tools, system_prompt, sampling, loop_hardening, context) are
# NOT stored in this file anymore — they come from the ACTIVE PROFILE,
# resolved at runtime:
#
#   - predefined profiles are compiled into the app: qwen3.8-27b,
#     qwen3.6-35b-a3b, gemma-4-26b-a4b-it, gemma-4-31b-it, and the
#     model-agnostic "generic" (read-only in the UI);
#   - custom profiles are created/edited in the Settings UI and persisted to
#     ~/.c0wrk/model-profiles.yaml (create-from-base, edit values and name,
#     delete; predefined profiles are read-only).
#
# A model_profiles.active_profile that no longer resolves (e.g. a custom profile
# deleted by hand) falls back to "generic" with a load warning — it never
# breaks the run. A LEGACY inline `small_llm:` section from an older
# config.yaml is ignored at load and dropped by the next save (its knob
# values do not migrate; the active profile's values apply instead).
#
# model_profiles:
#   # Master toggle. When false every variant is ignored. Default: false.
#   # Normally flipped from Settings → Model Profiles (RPC
#   # SetModelProfilesEnabled), which
#   # writes this key — there is no need to edit the file.
#   enabled: false
#   # Active profile id. Default: "generic".
#   active_profile: generic

# ---------------------------------------------------------------------------
# Goal — budget model.
# ---------------------------------------------------------------------------
# A goal captures the user's success condition and bounds how much work the
# agent may spend reaching it. The budget is turn-only: the agent pursues the
# goal until it declares the condition met, goes idle (anti-spin), or hits the
# turn cap. There are no token or wall-clock caps at the config level — a
# per-goal turn limit is selected in the UI (BudgetCombobox: ∞ / 3 / 5 / 10
# turns, or a custom number). An unlimited goal (∞) has no internal turn cap —
# the user controls it via pause/stop.



# ---------------------------------------------------------------------------
# Terminal — embedded PTY terminal (the in-app terminal panel).
# ---------------------------------------------------------------------------
# The terminal panel runs your login shell inside the app (xterm.js over a
# PTY). The shell always receives TERM=xterm-256color, COLORTERM=truecolor
# and TERM_PROGRAM=c0wrk (+ TERM_PROGRAM_VERSION). TERM_PROGRAM identifies
# the embedded terminal so your shell rc files can tell it apart from your
# real terminal — the same convention VSCode (TERM_PROGRAM=vscode), WezTerm
# and ghostty use.
#
# tmux users: if your rc auto-attaches tmux, guard it so the embedded
# terminal opens a fresh shell in the project directory instead of
# hijacking your live tmux session:
#
#   # ~/.zshrc
#   if [[ -z "$TMUX" && "$TERM_PROGRAM" != "c0wrk" ]]; then
#     tmux attach -t main || tmux new -s main
#   fi
#
# (A bare `exec tmux` with no guards cannot be intercepted by any app —
# the same is true in VSCode.)
#
# terminal:
#   # Extra environment variables for every terminal shell process. Values
#   # win over the inherited environment AND the built-in defaults above;
#   # ${VAR} references are expanded at startup. Use them to feed your rc
#   # files any marker they check (e.g. your own guard variable).
#   env:
#     C0WRK_TERMINAL: "1"
#     # MY_MARKER: ${MY_MARKER_VALUE}

# ---------------------------------------------------------------------------
# E2S — explicit-state execution mode (experimental)
# ---------------------------------------------------------------------------
# An alternative run style where the model maintains an externalized state Σ
# ("sigma") that is patched and re-presented every turn, instead of replaying
# a growing transcript — the request size stays O(1) in the number of turns.
# Every turn the model emits a state patch ΔΣ and one step action (a tool
# call, or a finish with the final answer). The state carries a fixed core
# schema (objective, checklist, files_touched, findings, decisions,
# next_steps, done_criteria, status) that is validated on every merge; core
# keys can be updated in place (same JSON type) but never deleted or
# re-typed, and any other key is a MUTABLE extension — a value write
# replaces the previous value in place (cursors and phase markers update
# under stable names), and a JSON null patch value deletes the key
# (extension keys only; null against a core key is rejected). The merged
# state is size-capped (state_byte_limit below). The domain types and the
# merge operator live in core/e2s.
#
# GATED: the entire section is ineffective, and the per-message E2S toggle is
# hidden, while experimental.enabled is false. There is no separate e2s master
# toggle — the experimental switch is the mode's only gate.
#
# e2s:
#   # Maximum number of E2S turns (patch+action cycles) per run. Exhaustion
#   # is a RESUMABLE checkpoint, not a failure: the task ends with partial
#   # status and Σ preserved; Resume re-enters the loop with the accumulated
#   # Σ and a fresh turn budget. Default: 50.
#   max_steps: 50
#   # Hard cap on the JSON-encoded size of the working state Σ, in bytes.
#   # A patch whose merged state exceeds the cap is rejected as a
#   # validation error (the model may retry); after the retries the error
#   # becomes the next observation and the run CONTINUES with Σ unchanged.
#   # The initial Σ is also checked up front, so an oversized objective
#   # fails fast instead of wedging every turn. Default: 16384.
#   state_byte_limit: 16384
#   # How many times a rejected state patch (validation error or over-limit
#   # Σ) may be re-requested from the model before the failure becomes an
#   # error observation (the run continues with Σ unchanged). Default: 1.
#   patch_retries: 1
#   # Cap on the tool observation fed back to the model each turn, in
#   # characters (longer observations are truncated; the full content is
#   # cached and the truncation nudge lets the model page through it via
#   # tool_result_read). Default: 2000.
#   observation_truncate: 2000
#   # Anti-spin: consecutive semantically identical step actions before a
#   # corrective nudge observation is injected instead of dispatching the
#   # redundant action again. The fingerprint is SEMANTIC — tool + the
#   # target-anchor args (path, pattern, command, query, url, name, skill,
#   # hash) plus the content payloads of write_file/edit_file
#   # (content/old_string/new_string); precision args such as line ranges
#   # and limits are ignored, so re-reading one file with shifting ranges
#   # still spins while successive different edits of one file do not;
#   # batch fingerprints per sub-call. Default: 3.
#   repeat_nudge_threshold: 3
#   # Anti-spin: consecutive semantically identical step actions before the
#   # run is aborted as a spin. Must be >= the nudge threshold so the model
#   # always gets at least one nudge first. Default: 5.
#   repeat_abort_threshold: 5

# ---------------------------------------------------------------------------
# Go runtime tunables (process-level; consumed once at startup)
# ---------------------------------------------------------------------------
runtime:
  # Soft memory limit for the Go runtime (debug.SetMemoryLimit) — a GC
  # target, NOT a hard cap: the heap may exceed it under live-set pressure,
  # the GC just runs more often. Without it the default GOGC=100 lets the
  # transient spike of a full project re-index roughly double the resident
  # set, and the memory is returned to the OS only lazily. The app also
  # forces a GC + scavenge (debug.FreeOSMemory) after every full indexing
  # pass regardless of this knob.
  #
  # Values:
  #   0 (or omitted) — AUTO: 50% of the machine's physical RAM, clamped to
  #                    [2 GiB, 8 GiB]. Unknown RAM falls back to the 2 GiB
  #                    floor.
  #   > 0            — explicit limit in MiB, applied verbatim.
  #   -1             — OFF: no soft limit is set at all.
  #   < -1           — rejected at config load (a typo, not a sentinel: only
  #                    -1 means off).
  #   > 2 PiB        — rejected at config load (the MiB→bytes shift would
  #                    overflow int64 and silently drop the limit).
  #
  # A GOMEMLIMIT environment variable that the Go runtime actually saw at
  # PROCESS START takes priority over AUTO mode (the runtime already applied
  # it); an explicit positive value here still wins over that env var for this
  # app. A GOMEMLIMIT injected later by login-shell env loading (macOS Finder
  # launch) was never read by the runtime, so it does NOT defer here — AUTO
  # applies instead.
  # Default: 0 (auto).
  memory_soft_limit_mb: 0


# ---------------------------------------------------------------------------
# OS Notifications
# ---------------------------------------------------------------------------
notifications:
  # How long a delivered notification banner stays on screen, in seconds.
  #
  # PRIVACY NOTE: banner bodies may carry task output (task completion and
  # error text). OS banners are kept in the notification center's history and
  # are commonly shown on the lock screen — content readable there without
  # unlocking the session. If that exposure is unacceptable, disable system
  # notifications entirely (Settings → General → System notifications) —
  # there is deliberately no content redaction: a banner whose body is
  # stripped is useless.
  #
  # Values:
  #   -1 (or omitted) — the notification daemon's own default (a handful of
  #                     seconds on most desktops).
  #    0              — NEVER expires: the banner stays until it is clicked or
  #                     dismissed. Use this if banners vanish before you get
  #                     to them — several daemons (KDE Plasma among them) drop
  #                     an expired banner silently, without keeping it in the
  #                     notification history.
  #   > 0             — explicit lifetime in seconds, capped at 86400 (a day).
  #
  # Values outside [-1, 86400] are clamped at send time and the clamp is
  # logged — mind the unit, seconds and not milliseconds.
  #
  # Linux only. The value becomes the freedesktop `expire_timeout` argument of
  # the org.freedesktop.Notifications Notify call; the macOS and Windows
  # notification centers own banner lifetime themselves and ignore it.
  # Editable from Settings → General → System notifications.
  banner_timeout_seconds: -1

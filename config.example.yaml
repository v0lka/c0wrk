# ===========================================================
# c0wrk Configuration
# ===========================================================
# Copy this file to config.yaml and adjust values as needed.
# Environment variables can be referenced as ${ENV_VAR}.
# ===========================================================

# Logging level: DEBUG, INFO, WARN, ERROR
log_level: "DEBUG"

# ---------------------------------------------------------------------------
# LLM Provider Configuration
# ---------------------------------------------------------------------------
llm:
  # The single, cross-provider default model — must be enabled in the corresponding
  # provider's models list below.
  #
  # The value may be a bare model name (e.g. "claude-sonnet-4-20250514") or a
  # composite identifier "providerName/modelName" (e.g. "lmstudio/gpt-4"). Use the
  # composite form when the same bare model name is exposed by more than one
  # provider, so the agent routes to the intended provider. A bare name that
  # matches several providers resolves to the first match (alphabetically by
  # provider name) and logs a warning.
  default_model: "claude-sonnet-4-20250514"

  anthropic:
    api_key: "${ANTHROPIC_API_KEY}"
    models:
      - "claude-sonnet-4-20250514"
    # Optional: per-provider output-token budget for every model above.
    # Applies when the provider's real limits differ from the built-in catalog
    # (proxies, gateways). 0 / omitted = inherit executor.output_token_reserve.
    # A per-model llm.models output_limit still wins over this value.
    # output_token_reserve: 12288

  openai_compatible:
    # Each key is a named provider (e.g. "lmstudio", "localai", "ollama").
    # The provider name is used in composite model IDs: "lmstudio/gpt-4".
    # NOTE: reliable tool calling on self-hosted servers (vLLM, llama.cpp, LM Studio,
    # Ollama) requires server-side configuration — see specs/domains/llm-providers.md
    # (parser/template per model family, sampling defaults, context-window sizing).
    lmstudio:
      base_url: "http://localhost:1234/v1"
      api_key: "" # Local servers usually don't need a key
      models:
        - "gpt-4"
        - "deepseek-chat"
      # Optional: output-token budget shared by all models of this provider —
      # both the context-window reserve and the MaxTokens ceiling. Useful when
      # a self-hosted gateway caps output below/above the built-in catalog.
      # 0 / omitted = inherit executor.output_token_reserve.
      # output_token_reserve: 8192

  anthropic_compatible:
    # Each key is a named provider speaking Anthropic's Messages API
    # (e.g. a proxy, gateway, or local Anthropic-compatible server).
    # The provider name is used in composite model IDs: "my-proxy/claude-sonnet-4-20250514".
    # base_url should point at the endpoint root (with or without a trailing /v1).
    # api_key is optional — local servers may not require authentication.
    # my-proxy:
    #   base_url: "https://my-anthropic-proxy.example.com"
    #   api_key: "${ANTHROPIC_PROXY_KEY}"
    #   models:
    #     - "claude-sonnet-4-20250514"

  chatgpt:
    api_key: "${OPENAI_API_KEY}"
    models: []

  # Override built-in model metadata per model name. Every field is optional and
  # uses a sentinel value meaning "inherit the built-in default": 0 for integers,
  # "" for strings, nil (omitted map) for capabilities. Only fields that differ
  # from the built-in metadata are persisted; when every field matches the
  # default the entry is removed automatically.
  models: {}
  #   "custom-model-name":
  #     # Maximum input+output tokens the model accepts / produces.
  #     context_window: 128000
  #     # Maximum tokens the model may emit in a single response.
  #     output_limit: 8192
  #     # Token counting strategy. One of:
  #     #   "approximate"           — character-ratio heuristic (no network)
  #     #   "tiktoken/o200k_base"   — GPT-4o / o1-family BPE encoding
  #     #   "tiktoken/cl100k_base"  — GPT-4 / GPT-3.5-turbo BPE encoding
  #     #   "anthropic-api"         — server-side counting via Anthropic API
  #     tokenizer_type: "tiktoken/o200k_base"
  #     # Model family — drives prompt formatting and feature detection. One of:
  #     #   "anthropic" | "openai_flagship" | "openai_standard" | "default"
  #     # (The registry recognizes additional families such as "google",
  #     #  "mistral", "deepseek", "qwen", "glm", "kimi", "openai_codex"; the four
  #     #  above are the curated set offered by the Configure dialog.)
  #     family: "openai_standard"
  #     # Wire protocol — request/response shape and endpoint path. One of:
  #     #   "chat_completions"  — OpenAI /v1/chat/completions (most compat servers)
  #     #   "responses"         — OpenAI /v1/responses (GPT-5 / o-series native)
  #     #   "anthropic"         — Anthropic /v1/messages (Claude models)
  #     protocol: "chat_completions"
  #     # Capability flags. Omit the whole map to inherit all built-in flags.
  #     # When present, all four flags are set atomically (a non-nil map fully
  #     # replaces the default set — partial inheritance is not supported).
  #     capabilities:
  #       attachment: true   # accepts image/PDF inputs
  #       reasoning: false   # supports reasoning/thinking mode
  #       temperature: true  # accepts the temperature parameter
  #       tool_call: true    # supports function/tool calling

  # Retry behavior for LLM API calls
  retry:
    max_retries: 3 # Max retry attempts (0 = no retries)
    initial_backoff: "1s" # Initial backoff duration
    max_backoff: "30s" # Maximum backoff duration

# ---------------------------------------------------------------------------
# MCP (Model Context Protocol) Servers
# ---------------------------------------------------------------------------
mcp:
  servers: {}
  #   example-server:
  #     transport: "stdio"         # "stdio" or "http"
  #     command: "npx"             # Command to execute (stdio)
  #     args: ["-y", "some-mcp"]   # Arguments (stdio)
  #     env:                       # Environment variables (stdio)
  #       SOME_VAR: "value"
  #     url: ""                    # HTTP endpoint URL (http transport)
  #     headers: {}                # HTTP headers (http transport)

# ---------------------------------------------------------------------------
# Agent Skills Discovery
# ---------------------------------------------------------------------------
# Directories to scan for Agent Skills (agentskills.io spec).
# Each subdirectory with a valid SKILL.md file becomes a skill.
# Paths may be absolute or relative to the agent directory (~/.c0wrk).
# Directories are scanned in priority order (highest first).
skills:
  dirs:
    - "~/.agents/skills" # user-wide skills directory
    - "~/.c0wrk/.agents/skills" # c0wrk-specific skills directory
  # Note: in addition to the directories above, the current project's
  # `.agents/skills` directory is always scanned automatically (highest priority).

# ---------------------------------------------------------------------------
# Subagent Profiles Discovery
# ---------------------------------------------------------------------------
# Directories to scan for Subagent Profiles (<name>/AGENT.md, ADR-021).
# Paths may be absolute or relative to the agent directory (~/.c0wrk).
# Directories are scanned in priority order (highest first).
# Omitting the key entirely keeps the defaults below; an explicit empty
# list opts out of the base directories (mirrors `skills.dirs`).
agents:
  dirs:
    - "~/.agents/agents" # user-wide subagent profiles directory
    - "~/.c0wrk/.agents/agents" # c0wrk-specific subagent profiles directory
  # Note: in addition to the directories above, the current project's
  # `.agents/agents` directory is always scanned automatically (highest priority).

# ---------------------------------------------------------------------------
# Memory / Persistence
# ---------------------------------------------------------------------------
# The SQLite database is always stored at ~/.c0wrk/database.db
# (no longer configurable — the memory.database key is retired).

# ---------------------------------------------------------------------------
# Router
# ---------------------------------------------------------------------------
router:
  history_window: 10 # Number of prior messages included in routing context

# ---------------------------------------------------------------------------
# Executor & Agent Execution
# ---------------------------------------------------------------------------
executor:
  max_retries: 2 # Maximum retries on execution failure (legacy, retained for framework.go)
  # Tokens reserved for model output generation: subtracted from the model's
  # context window during overflow validation and used as the executor's
  # MaxTokens ceiling for models without explicit metadata. Can be overridden
  # per provider (see llm.*.output_token_reserve) and per model
  # (see llm.models.<name>.output_limit) — those win over this global value.
  output_token_reserve: 8192
  # --- Mechanical Edit Verification -----------------------------------------
  # After every SUCCESSFUL write_file / edit_file in a CODE task, run the
  # configured command (e.g. `go test ./...`, `npm test`, `ruff check .`) and
  # inject its truncated output back into the agent context as a system
  # observation — "edit → verify → result" instead of self-attested done.
  #
  # Security: the command is ALWAYS taken from this config, never from the
  # model. It still passes the execute-group deny policy and the shell command
  # blacklist; interactive confirmation is skipped because you authored the
  # command. Re-runs are debounced: no second run until the next new edit.
  # Not active in CHAT (No Project) mode or goal-loop turns. Default: off.
  verify_on_edit:
    enabled: false # Master switch (default off)
    command: "" # e.g. "go test ./... -count=1" — required when enabled
    timeout: 2m # Go duration; empty/invalid falls back to 2m; effectively capped by timeouts.bashMaxTimeout
    max_output_chars: 4000 # Cap on injected output (0 → SDK default 4000)
  # --- Context Compaction ---------------------------------------------------
  compaction:
    # Sliding-window compaction
    sliding_window:
      keep_first: 3 # First N steps always preserved
      keep_last: 10 # Last N steps always preserved

    # Summarization compaction
    summarization:
      block_size: 7 # Steps per summarization block
      keepLast: 5 # Recent steps preserved verbatim

    # Hierarchical (3-zone) compaction
    hierarchical:
      enabled_above_steps: 25 # Activate when step count exceeds this
      distantRatio: 0.4 # Budget ratio for distant zone
      middleRatio: 0.3 # Budget ratio for middle zone
      recentRatio: 0.3 # Budget ratio for recent zone

    # Context-usage thresholds that trigger compaction
    thresholds:
      predictive_percent: 85 # Predictive compaction trigger
      warning_percent: 92 # Warning-level compaction trigger
      emergency_percent: 98 # Emergency compaction trigger
      pre_warning_percent: 75 # store_fact nudge trigger (must be < predictive_percent)

    maxSummarizeTokens: 16000 # Max tokens for summarization LLM calls
    observationTruncate: 500 # Characters to truncate observations in summaries
    safetyMarginPercent: 5 # % of context window reserved as safety margin
    manualTargetPercent: 30 # Target context fill (%) user-triggered manual compaction aims to reach; 0/unset falls back to 30

  # --- Tool Result Budget ---------------------------------------------------
  tool_result_budget:
    hard_cap_tokens: 4096 # Absolute max tokens per tool result
    max_fill_fraction: 0.3 # Max fraction of available context space
    cacheTTLSeconds: 300 # TTL in seconds for MCP tool cache entries

  # --- Tool Output Pruning --------------------------------------------------
  toolOutputPruning:
    keepLastN: 3 # Recent tool outputs to keep intact (role-based per-step defaults override this)
    protectedTools: ["store_fact", "search_facts"] # Tools whose outputs are never pruned
    thresholdPercent: 50 # Context fill % below which pruning is skipped entirely (0 = always prune)

  # --- History Mutation (regular, non-emergency) ----------------------------
  # Reduces O(n²) replay cost by replacing old tool results with cache
  # references. Information is preserved via ToolResultCache — the LLM can
  # retrieve evicted content via tool_result_read. Independent of emergency
  # compaction (which triggers at fill % thresholds).
  historyMutation:
    toolResultEvictionStep: 10 # Evict tool results to cache refs after N steps (0 = disabled)
    evictStepStatus: false # Evict update_checklist results immediately (pure bookkeeping)
    dedupRepeatedReads: false # Replace duplicate file reads with cache reference

  # --- Circuit Breaker (loop protection) ------------------------------------
  # Thresholds calibrated against real-session telemetry. Mutating tools
  # (write_file, edit_file, create_directory, delete_file, delete_directory)
  # and meta-tools (update_checklist, set_step_status, store_fact) are excluded
  # from the fruitless and same-tool-repeat detectors — their short, similarly-
  # sized successful results are legitimate in bursts (e.g. batch file edits
  # each returning "successfully edited file"). Thresholds below apply only to
  # exploration/search tools where consecutive short results indicate a stuck
  # loop.
  circuitBreaker:
    repeatNudgeThreshold: 3 # Identical tool calls before nudge
    repeatAbortThreshold: 5 # Identical tool calls before abort
    truncationAbortThreshold: 3 # Consecutive truncated responses before abort
    parseErrorAbortThreshold: 3 # Consecutive parse errors before abort
    fruitlessNudgeThreshold: 5 # Fruitless tool calls before nudge
    fruitlessAbortThreshold: 8 # Fruitless tool calls before abort
    fruitlessMaxResultLen: 48 # Max result length to consider fruitless
    sameToolRepeatNudgeThreshold: 8 # Same tool repeated calls before nudge
    sameToolRepeatAbortThreshold: 12 # Same tool repeated calls before abort
    sameToolResultSizeDelta: 128 # Result size delta for same-tool detection

# ---------------------------------------------------------------------------
# Security & Tool Access Policies
# ---------------------------------------------------------------------------
security:
  # LLM-based safety judge (used on-demand via "Ask agent" button)
  judge:
    model: "" # Model override for judge calls (empty = use default)

  # When true, file write tools (write_file, edit_file, delete_file,
  # delete_directory, create_directory) execute without confirmation when
  # all paths in their input are within the session roots — the workspace,
  # the session temp directory, and any additional working directories
  # (all treated as equal peers). Symlink traversals that resolve out of
  # session roots are still forced to confirmation regardless.
  # Default: false. Set to true if you prefer convenience over safety for
  # write operations within your own projects.
  auto_approve_workspace_writes: false

  # Smart Approve: when true, a strict OWASP ASI (ASI01–ASI10) LLM judge
  # automatically evaluates every escalated call — whether it comes from an
  # effective user_confirm policy or from a hard safety reason surfaced by
  # an allow-group tool — after all deterministic gates and workspace
  # auto-approval above. This is the unified confirmation funnel: there is
  # no separate bypass path for hard reasons.
  #   - A strict ALLOW executes without UI.
  #   - CONFIRM, judge errors, timeouts, and unparseable responses always
  #     fall back to manual confirmation (the "Ask Agent" button is hidden
  #     because the strict judge already evaluated the call).
  #   - HARD reasons (a fired security control: command blacklist, SSRF
  #     escape, symlink escape out of the session roots; or an unassessable
  #     input: degraded SSRF protection, an undeterminable URL/path) always
  #     consult the strict judge, even for allow-group tools.
  #   - Deterministic backstop: a canonical hard reason — a fired control
  #     (blacklist, SSRF, symlink escape) or an unassessable input — can
  #     never be auto-approved by the strict judge; canonicality is matched
  #     by typed reason codes (JudgeOutcome.ReasonCode, an sp4rk contract),
  #     not by prose. An ALLOW verdict is overridden to CONFIRM, so the
  #     user still decides.
  # deny groups are never judged (always blocked). Default: false.
  smart_approve: false

  # --- Tool security groups (security.groups) ---
  # Policies are configured per tool GROUP, not per tool name. Every tool
  # belongs to exactly one group:
  #   local_read   — read-only local filesystem tools (read_file, glob,
  #                  ripgrep, list_directory).                    Default: allow
  #   remote_read  — read-only remote access (web_search, web_fetch).
  #                                                                Default: allow
  #   execute      — shell execution (bash_exec, posh_exec). The only group
  #                  that supports a command blacklist.  Default: user_confirm
  #   local_write  — local filesystem writes (write_file, edit_file,
  #                  delete_file, create_directory, delete_directory).
  #                                                 Default: user_confirm
  #   local_mcp    — MCP servers launched locally over the stdio transport.
  #                                                 Default: user_confirm
  #   remote_mcp   — MCP servers reached over the network (http transport).
  #                                                 Default: user_confirm
  #   remote_write — tools that mutate remote resources (e.g. remote MCP
  #                  mutations).                     Default: user_confirm
  # Policy values: "allow" | "user_confirm" | "deny". A group omitted here
  # keeps its default policy (reads: allow; mutations: user_confirm); the
  # registry additionally fails safe to user_confirm for any group that has
  # no configured entry at all.
  groups:
    local_read:
      policy: "allow"
    remote_read:
      policy: "allow"
    execute:
      policy: "user_confirm"
      # The execute blacklist applies to every shell command (bash_exec and
      # posh_exec alike). The patterns cover both shell dialects, organized
      # into destructive categories; PowerShell-specific patterns carry an
      # (?i) prefix because PowerShell is case-insensitive.
      # A matching command is forced to confirmation regardless of policy.
      # NOTE: omit `blacklist:` entirely to track the app's shipped defaults —
      # an explicit list (this example's) is pinned and will NOT receive
      # future default-list improvements. Saving a list identical to the
      # shipped defaults — from any settings tab — stores it as unset for the
      # same reason, so an untouched blacklist never gets pinned into this
      # file.
      blacklist:
        # --- Destructive file/disk operations ---
        - 'rm\s+-rf\s+/'
        - "mkfs"
        - 'dd\s+if='
        # `dd of=` writing to a block or kernel-memory device destroys the disk
        # or escalates privileges (e.g. `dd of=/dev/sda bs=1M` with no if=, which
        # the `dd\s+if=` pattern misses). Shares the same device-prefix list as
        # the narrowed /dev/ redirect below so benign targets like
        # `dd of=/dev/null` stay unblocked. `[^|]*` prevents the match from
        # jumping across a pipe.
        - 'dd\b[^|]*\bof=/dev/(sd|hd|vd|xvd|nvme|mmcblk|loop|ram|zram|dm-|md|disk|mapper|mem|kmem|port)'
        # Write/redirect to a block or kernel-memory device destroys the disk or
        # escalates privileges. Narrowed from a blanket '>\s*/dev/' so the benign
        # /dev family (/dev/null, /dev/zero, /dev/full, /dev/random, /dev/std*,
        # /dev/fd, /dev/tty) — the most common redirect targets in commands like
        # `cmd 2>/dev/null` — no longer trigger a forced confirmation under
        # allow. Matches every real block device family (sd, hd, vd, xvd,
        # nvme, mmcblk, loop, ram, zram, dm-, md, disk, mapper) plus kernel
        # mem/port, sharing none of its prefixes with any benign /dev entry.
        - '>\s*/dev/(sd|hd|vd|xvd|nvme|mmcblk|loop|ram|zram|dm-|md|disk|mapper|mem|kmem|port)'
        # --- Power-state (shutdown / Stop-Computer) ---
        - '\b(shutdown|reboot|halt|poweroff|init\s+[06])\b'
        # --- Remote-exec / download-cradle (curl|sh, IWR|iex) ---
        # Piped execution of fetched content — a classic supply-chain / RCE
        # vector. Blocks regardless of policy, even under allow.
        - '\b(curl|wget)\b.*\|\s*(?:\S*/)?(?:env\s+)?\b(sh|bash|zsh|dash|ksh|fish|perl\d*|node|ruby|python[\d.]*)\b'
        # --- Irreversible system writes (>/etc/passwd, System32) ---
        - '>\s*/etc/(passwd|shadow|sudoers|group|fstab)\b'
        - '(tee|dd)\b[^|]*/etc/(passwd|shadow|sudoers)\b'
        - '\bchmod\b[^|]*\b777\b[^|]*/(etc|usr|boot|bin|sbin)\b'
        - '>\s*/boot/'
        # --- Misc hardening (registry/scheduled-task tampering) ---
        - ':\(\)\s*\{' # fork bomb
        - '\bcrontab\s+-r\b' # wipe crontab
        - '\b(iptables|ufw|nft)\b[^|]*(-F\b|--flush\b|-X\b|-P\s+\w+)' # firewall flush
        # --- Privilege escalation ---
        - 'sudo\s+'
        # --- SCM (git) — mutating subcommands only ---
        # Blocks git operations that change the repository, its history, or the
        # working tree/index. Read-only commands (status, log, diff, show, blame,
        # ls-files, rev-parse, describe, fetch, ...) are intentionally NOT blocked.
        # Dual-mode subcommands (branch, tag, config, stash, remote) are blocked
        # wholesale: RE2 has no lookahead, so flagless mutating forms (e.g.
        # `git branch x`, `git stash`, `git config k v`, `git tag v1`) cannot be
        # reliably separated from read-only forms. `git fetch` is excluded — it only
        # adds objects and updates remote-tracking refs, never the working tree,
        # local branches, or history (additive / non-destructive).
        # working tree / index / staging:
        - '\bgit\s+(add|rm|mv|clean|checkout|switch|restore|stash|apply)\b'
        # history / commits / refs (incl. history rewrites):
        - '\bgit\s+(commit|am|merge|rebase|revert|cherry-pick|reset|notes|replace|update-ref|symbolic-ref|reflog|bisect|filter-branch|filter-repo|fast-import)\b'
        # branch / tag / remote / submodule / network / exfil (transmit patch
        # data or spawn a network server bound to the repo):
        - '\bgit\s+(branch|tag|remote|submodule|clone|push|pull|send-email|imap-send|daemon|instaweb)\b'
        # repo lifecycle / config / maintenance:
        - '\bgit\s+(init|config|gc|prune|worktree|maintenance)\b'
        # --- PowerShell specifics (case-insensitive cmdlets/aliases) ---
        # Remove-Item matches parameters by case-insensitive prefix
        # (-r/-rec/-recurse, -f/-fo/-force); RE2 has no lookaheads, so the
        # two-order requirement for -Recurse + -Force is expressed as two
        # patterns. Only the unambiguous cmdlet name carries the short-flag
        # patterns here: this list is also compiled into bash_exec on Unix,
        # where the Remove-Item ALIASES (rm, del, erase, ri, rd, rmdir) are
        # ordinary vocabulary (`rm -r -f <dir>` is the routine spelling of an
        # in-workspace delete). The alias patterns are instead enforced as a
        # Windows-only platform supplement inside the app (see ADR-024) and
        # cannot be removed by editing this list.
        - '(?i)\bRemove-Item\b.*-r\w*.*-f\w*'
        - '(?i)\bRemove-Item\b.*-f\w*.*-r\w*'
        - '(?i)Format-Volume'
        - '(?i)Clear-Disk'
        - '(?i)Stop-Computer'
        - '(?i)Restart-Computer'
        # Piped or chained execution of fetched content
        # (Invoke-WebRequest | Invoke-Expression) — the #1 PowerShell RCE /
        # supply-chain vector.
        - '(?i)\b(Invoke-WebRequest|iwr|irm|Invoke-RestMethod|curl|wget)\b[^|]*\|\s*(Invoke-Expression|iex)\b'
        - '(?i)\b(Invoke-WebRequest|iwr|irm|Invoke-RestMethod|curl|wget)\b[^;]*;[^;]*\b(Invoke-Expression|iex)\b'
        - '(?i)\b(Set-Content|Clear-Content|Out-File|Add-Content)\b[^|]*\b(Windows\\System32|\\Windows\\|\\etc\\|\\boot)'
        - '(?i)\bSet-ItemProperty\b[^|]*HKLM' # registry tampering
        - '(?i)\b(Register-ScheduledTask|schtasks\s+/create)\b' # scheduled tasks
        - '(?i)Set-ExecutionPolicy' # execution-policy tampering
        # PowerShell resolves the git executable case-insensitively, so the
        # mutating git subcommand patterns above are repeated with (?i):
        - '(?i)\bgit\s+(add|rm|mv|clean|checkout|switch|restore|stash|apply)\b'
        - '(?i)\bgit\s+(commit|am|merge|rebase|revert|cherry-pick|reset|notes|replace|update-ref|symbolic-ref|reflog|bisect|filter-branch|filter-repo|fast-import)\b'
        - '(?i)\bgit\s+(branch|tag|remote|submodule|clone|push|pull|send-email|imap-send|daemon|instaweb)\b'
        - '(?i)\bgit\s+(init|config|gc|prune|worktree|maintenance)\b'
    local_write:
      policy: "user_confirm"
    local_mcp:
      policy: "user_confirm"
    remote_mcp:
      policy: "user_confirm"
    remote_write:
      policy: "user_confirm"

  # --- Indirect prompt injection defense ---
  # Content from untrusted external tools (web_search, web_fetch, bash_exec,
  # ripgrep, glob, read_file, MCP) is wrapped in <untrusted-content> XML tags
  # before entering the LLM context. The system prompt instructs the LLM to
  # treat tagged content as data, not instructions.
  injection_defense:
    enabled: true # Always-on in current implementation (no runtime gating)

# ---------------------------------------------------------------------------
# Web Search
# ---------------------------------------------------------------------------
search:
  provider: "tavily" # Web search provider
  api_key: "${TAVILY_API_KEY}"

# ---------------------------------------------------------------------------
# Tool Output Limits
# ---------------------------------------------------------------------------
toolLimits:
  # File read limits
  readDefaultLines: 2000 # Max lines returned per read_file call (default window when no range specified)

  # Search limits
  webSearchMaxResults: 5 # Max web search results

  # --- Per-tool Stage 1 truncation (applied before token budget) ------------
  # These limits trigger output fragmentation: when tool output exceeds the
  # limit, it is truncated and a nudge with a cache hash is appended so the
  # LLM can read the full result in fragments via tool_result_read.
  # Set conservative values here so fragmentation activates for realistic
  # large-output scenarios (e.g. reading files >2000 lines).
  # Omitted tools receive no Stage 1 truncation. Use 0 to disable a dimension.
  #
  # Note: read_file uses a streaming reader (O(1) memory) that caps output at
  # read time via MaxWindowLines (50000, hardcoded). The maxLines value below
  # is a secondary safety net on the already-windowed output. The primary cap
  # is readDefaultLines (the default window size).
  #
  # Lowering these limits increases fragmentation frequency and thus LLM call
  # count (each fragment read costs an extra tool-call iteration), but reduces
  # memory and context overhead per individual tool result. Balance these
  # values based on your typical file sizes and available context window.
  perToolTruncation:
    read_file:
      maxLines: 2000 # secondary; primary cap is the streaming reader window
    read_attachment:
      maxLines: 2000 # in-memory markdown attachments; Stage 1 fragmentation parity with read_file
    ripgrep:
      maxLines: 2000
    glob:
      maxLines: 2000
    list_directory:
      maxLines: 2000
    web_fetch:
      maxBytes: 2097152  # 2 MiB
    bash_exec:
      maxLines: 5000
    posh_exec:
      maxLines: 5000

# ---------------------------------------------------------------------------
# Timeouts (in seconds)
# ---------------------------------------------------------------------------
timeouts:
  bashMaxTimeout: 120 # Max execution time for bash commands
  bashWaitDelay: 5 # Wait delay for bash process cleanup
  ripgrepTimeout: 60 # Timeout for ripgrep searches
  webFetchTimeout: 30 # Timeout for web page fetching
  webSearchTimeout: 30 # Timeout for web search queries
  persistenceTimeout: 5 # Timeout for persistence (DB) operations
  llmRequestTimeout: 600 # Timeout for a single LLM API call in the main chat loop (10 min). 0 = use default 600s
  serviceLLMRequestTimeout: 120 # Timeout for one-shot "service" LLM requests (session title, commit message, prompt optimization) (2 min). 0 = use default 120s

# ---------------------------------------------------------------------------
# Orchestration Limits
# ---------------------------------------------------------------------------
orchestration:
  maxDependencyContextChars: 8000 # Max chars for dependency context injection
  maxSummaryLength: 500 # Max summary length in characters
  maxJudgeCacheSize: 1000 # Max entries in judge decision cache
  # Maximum recursive delegation depth when allow_redelegate is true (ASI07-R6).
  # Limits how deeply a subagent may delegate further. 0 = use default (2).
  maxRedelegationDepth: 2

# ---------------------------------------------------------------------------
# Goal Loop
# ---------------------------------------------------------------------------
# Controls the goal-derivation / verification loop. verification gates the
# independent verifier turn that confirms task completion before success:
#
#   independent  (default) — the loop runs an independent verifier turn.
#   off                    — the verifier is disabled; the loop relies solely
#                            on the agent's own declare_goal_status verdict.
#
# goal_loop:
#   verification: independent

# ---------------------------------------------------------------------------
# Workspace Ignore Files (.gitignore / .aiignore)
# ---------------------------------------------------------------------------
# c0wrk respects repository ignore files to decide which files and directories
# are excluded from the file tree view and the vector index:
#
#   - .gitignore  — standard git ignore rules, consulted for every project.
#   - .aiignore   — optional, AI-specific ignores layered on top of
#                   .gitignore. Use it to hide files that git tracks but the
#                   agent/indexer should not see (e.g. generated reports,
#                   vendored snapshots).
#
# Recommended .aiignore recipe (files git tracks but the agent rarely needs):
#
#   go.sum
#   package-lock.json
#   *.lock
#
# Hidden directories (entries starting with '.') are always excluded regardless
# of ignore files. There is no per-key workspace configuration: control what is
# indexed by editing .gitignore / .aiignore at the project root.

# ---------------------------------------------------------------------------
# Vector Index / Hybrid Search
# ---------------------------------------------------------------------------
# Controls whether the vector index operates in hybrid (vector + BM25)
# or vector-only mode. When hybrid is true (the default), the service
# writes each chunk to both chromem (embeddings) and bleve (BM25), and
# queries fuse the ranked lists with Reciprocal Rank Fusion (k=60).
#
# Set hybrid: false to disable lexical search entirely — the bleve
# directory will still be opened but never consulted at query time.
#
# Hybrid RRF tuning knobs (all optional; omitted values use built-in
# defaults). These control how the vector and lexical ranked lists are
# fused into a single result set.
#
#   hybrid_rrf_k: 60
#     Reciprocal Rank Fusion constant k. Lower k makes top ranks weigh
#     more (steeper curve); higher k flattens the curve. 60 is the
#     conventional default (Cormack/Clarke/Buettcher, TREC 2009).
#
#   hybrid_fanout_multiplier: 4
#     Per-side candidate pool = max(topK * multiplier, fanout_min). A
#     larger pool improves recall but feeds more noise into RRF.
#
#   hybrid_fanout_min: 100
#     Minimum per-side fanout, applied when topK * multiplier is small.
#
# Pre-fusion score thresholds (suppress noise-tail promotion). Hits
# below these cutoffs are discarded BEFORE RRF fusion, so weakly
# semantic chunks that merely contain a query term cannot earn a double
# RRF boost and jump above genuinely relevant one-sided hits. Set a
# threshold to 0 to disable it.
#
#   hybrid_vector_score_floor: 0.0
#     Absolute cosine-similarity floor. Vector hits with similarity
#     below this value are discarded before fusion. 0 disables the
#     absolute floor (default).
#
#   hybrid_vector_score_ratio: 0.25
#     Relative cosine cutoff. A vector hit is discarded when its
#     similarity is below ratio × top similarity among the post-filter
#     vector hits. 0.25 keeps hits within 25% of the best match.
#
#   hybrid_lexical_score_ratio: 0.1
#     Relative BM25 cutoff. A lexical hit is discarded when its BM25
#     score is below ratio × top BM25 among the post-filter lexical
#     hits. BM25 magnitudes vary widely across queries, so a relative
#     threshold is more robust than an absolute one.
#
# Embedding thread pool (ONNX intra-op). Controls how many threads the
# embedding model may use during (re)indexing. Unset or 0 = all cores
# (legacy default, maximum throughput but a CPU spike). Set it to cap
# CPU usage at the cost of indexing speed:
#
#   embedding_threads: 0   # all cores (default; legacy behaviour)
#   embedding_threads: 1   # minimum CPU load, slowest indexing
#   embedding_threads: 2   # balance between quiet operation and speed
#
# Note: this caps only the ONNX intra-op thread pool — i.e. the vector
# (embedding) side of the index. The lexical/BM25 side is pure Go and
# unaffected by this knob.
#
# Indexing throughput / latency knobs:
#
#   embedding_batch_size: 32   # rows per ONNX batch inference (default).
#                              # Larger batches amortize inference across more
#                              # chunks (higher indexing throughput up to the
#                              # measured plateau) but linearly grow the
#                              # per-inference output tensor (~1 MiB per row)
#                              # and single-call latency. 32 sits at the knee
#                              # of the measured throughput curve; lower it on
#                              # memory-constrained machines.
#
#   prep_workers: 2            # parallel file-preparation workers
#                              # (read/hash/chunk) overlapping ONNX inference
#                              # in the indexing pipeline (default 2). 1
#                              # reproduces the historical serial behaviour;
#                              # embedding itself stays single-threaded under
#                              # the service write lock regardless.
#
#   debounce_ms: 1000          # watcher debounce window in milliseconds
#                              # (default 1000, the historical value). Bursts
#                              # of file-change events coalesce into a single
#                              # incremental index pass after this quiet
#                              # period. Lower = fresher index but more passes
#                              # during active editing; higher = fewer passes.
#                              # Unchanged files are detected by a stat
#                              # fast-path (size + mtime) without re-reading
#                              # or re-hashing them; this is heuristic — a
#                              # rewrite preserving both (archive extraction
#                              # restoring mtimes, some sync tools) escapes
#                              # it — so every 20th validation pass re-reads
#                              # and re-hashes everything as a backstop.
#
#   chunk_overlap: 200         # characters of overlap between adjacent chunks
#                              # (default 200, the historical value). Higher
#                              # overlap improves recall at chunk boundaries
#                              # but increases the number of embedded chunks
#                              # (and thus indexing time/memory). Changing
#                              # this (or max_chunk_size) is picked up
#                              # automatically: sidecar entries record the
#                              # chunker configuration they were produced
#                              # under, and the next incremental pass re-
#                              # indexes affected files — no manual Reindex
#                              # needed.
#
# Search readiness bound:
#
#   search_wait_timeout_ms: 3000
#                              # how long a consumer may WAIT for the vector
#                              # index to become ready — e.g. right after a
#                              # project switch while the initial pass is
#                              # still running (default 3000). An explicit
#                              # 0 means "fail fast": never wait, serve
#                              # immediately with whatever is indexed.
#                              # Unset resolves to 3000; 0 is preserved as a
#                              # deliberate sentinel, not defaulted. The
#                              # bound covers readiness waiting exactly once
#                              # per consumer: the semantic_search tool waits
#                              # in its dedicated wait step (the search itself
#                              # never waits), RAG hints call wait+search
#                              # under one shared deadline, and the
#                              # SearchVectorStore RPC bounds its single
#                              # call. Query execution is separately bounded
#                              # by the same value as defense-in-depth.
#
#   max_chunks_per_file: 4000  # upper bound on chunks one file may contribute
#                              # to an index pass (default 4000). Files that
#                              # exceed it are skipped wholesale (WARN) — a
#                              # backstop against data-format files (BPE
#                              # vocab/merges, minified assets, lockfiles)
#                              # that would otherwise hang/OOM the embedder.
#
# Not exposed (deliberate): the embedding model's MaxSeqLength (512) and
# HiddenDim (512) are fixed properties of the bundled jina-v2-small model —
# changing them without swapping the model only produces wrong embeddings,
# so they are not user-configurable knobs.
# File-size and chunk-size limits:
#
#   max_file_size: 4194304   # 4 MiB (default). Files larger than this are
#                            # skipped before being read into memory for
#                            # chunking/embedding. Necessary because the NUL-
#                            # byte binary check cannot recognize every binary
#                            # format (ONNX/safetensors protobufs have readable
#                            # ASCII headers with no NUL), so without this limit
#                            # a multi-hundred-MB model file would be loaded
#                            # whole and explode memory. Raise it if legitimate
#                            # large source files are excluded from search;
#                            # lower it to bound memory on constrained machines.
#
#   max_chunk_size: 1500     # characters (default). Maximum chunk size passed
#                            # to the chunker. Sized to fit the embedding
#                            # model's context window (MaxSeqLength 512 tokens).
#                            # Raising it significantly risks producing chunks
#                            # the model cannot embed in a single pass.
#
# vector_index:
#   hybrid: true
#   hybrid_rrf_k: 60
#   hybrid_fanout_multiplier: 4
#   hybrid_fanout_min: 100
#   hybrid_vector_score_floor: 0.0
#   hybrid_vector_score_ratio: 0.25
#   hybrid_lexical_score_ratio: 0.1
#   embedding_threads: 0
#   embedding_batch_size: 32
#   prep_workers: 2
#   debounce_ms: 1000
#   chunk_overlap: 200
#   search_wait_timeout_ms: 3000
#   max_file_size: 4194304
#   max_chunk_size: 1500
#   max_chunks_per_file: 4000

# ---------------------------------------------------------------------------
# Proxy — HTTP/HTTPS proxy for all outbound connections.
# ---------------------------------------------------------------------------
# When enabled, all LLM requests, web_search, web_fetch, MCP HTTP transports,
# and model registry calls go through this proxy. Hosts in bypass_list connect
# directly. The tls_cert_dir (optional) adds custom CA certificates for TLS
# verification through the proxy (e.g., corporate MITM proxy root CA).
#
# proxy:
#   enabled: false
#   url: "http://user:password@proxy.corp.local:8080"
#   bypass_list:
#     - localhost
#     - 127.0.0.1
#   tls_cert_dir: ""  # /path/to/custom/ca-certs
#   set_global_env: true  # Export HTTP_PROXY/HTTPS_PROXY/NO_PROXY/SSL_CERT_DIR
#                         # for subprocesses (bash_exec, MCP stdio servers).
#                         # Default: true. Set to false to prevent proxy state
#                         # from leaking into third-party libraries that read
#                         # env vars at init time.

# ---------------------------------------------------------------------------
# Experimental Features
# ---------------------------------------------------------------------------
# Master switch for features that are still under active development. It is
# all-or-nothing: enabling it exposes every gated feature, disabling it hides
# every gated feature and treats each as off. Gated features today:
#   - RESEARCH mode (the left-sidebar research panel)
#   - the Small-LLM profile settings tab
#
# experimental:
#   # Master switch. Default: false (all experimental features off).
#   enabled: false

# ---------------------------------------------------------------------------
# Updates — automatic "check for updates"
# ---------------------------------------------------------------------------
# Controls the self-update subsystem. All update configuration lives here —
# there is no separate user-preference file.
#
# updates.enabled is the master switch for the entire subsystem (operator
# level). updates.auto_check narrows the automatic background check only: when
# false the app never polls on startup, but manual checks from the UI still
# work (provided enabled is true).
#
# When updates.enabled is false: CheckForUpdates reports no update, the
# background auto-check never runs, and the UI disables all update affordances.
#
# The check is best-effort and never blocks or breaks startup: network errors
# are swallowed silently. The timestamp of the last check (and the currently-
# skipped version) are persisted to ~/.c0wrk/update_state.json, NOT here — this
# file only configures the toggles and the cadence.
#
# updates:
#   # Master switch for the whole update subsystem. Default: true. When false
#   # the app never auto-checks on startup AND manual checks report no update.
#   enabled: true
#   # Whether to poll for updates automatically on startup. Default: true.
#   # When false only the automatic background check is suppressed — manual
#   # checks from the UI still work. Also settable from the Settings UI (the
#   # toggle writes straight back into this file). NOTE: saving from the UI
#   # re-serializes the ENTIRE config.yaml — any hand-written comments in the
#   # file are dropped. ${VAR} environment references are preserved as-is (they
#   # are expanded only at load time).
#   auto_check: true
#   # Minimum time between automatic checks, as a duration string parsed by
#   # time.ParseDuration (e.g. "6h", "30m", "24h"). Default: "6h". An
#   # unparseable value falls back to 6h.
#   check_interval: "6h"

# ---------------------------------------------------------------------------
# Small-LLM Profile
# ---------------------------------------------------------------------------
# Optimizations applied when running on a "small" (low-capacity / cheaper) LLM.
# The master toggle is MANUAL ONLY — there is no auto-detection; you decide
# when to enable the profile. Each variant carries its own sub-toggle so a
# single optimization can be turned off without disabling the whole profile,
# and every threshold/value is exposed so behaviour can be tuned without a
# rebuild.
#
# small_llm:
#   # Master toggle. When false every variant is ignored. Default: false.
#   enabled: false
#
#   # --- Essential Tools -----------------------------------------------------
#   # Narrows the visible tool set for the model via semantic tool selection.
#   # The router selects the tools relevant to the current task; this variant
#   # exposes only that matched set (plus the user's always-present picks, the
#   # protected base, and every MCP tool), reducing the JSON-schema/token
#   # overhead injected into every prompt. There is no fixed allow-list and no
#   # domain-specific narrowing — the router and the user decide relevance.
#   essential_tools:
#     # Gates this variant in addition to the master `enabled` toggle above
#     # (selection is applied only when both are on).
#     enabled: false
#     # Tools always kept regardless of router selection. Protected tools
#     # (finish, memory, ask_user, MCP) are always included and cannot be
#     # removed.
#     always_present:
#       - read_file
#       - write_file
#       - edit_file
#       - list_directory
#       - glob
#       - ripgrep
#       - bash_exec
#       - semantic_search
#       - store_fact
#       - search_facts
#       - ask_user
#       - finish
#     # Slot budget for router-matched tools. The guaranteed set — always
#     # present ∪ protected (finish, memory, ask_user) ∪ every MCP tool — is
#     # NEVER trimmed: at most max_tools − len(guaranteed) router-matched
#     # tools are kept, filled in registry order. Validation rejects a cap
#     # smaller than the guaranteed set itself. 0 = unlimited. Default: 16.
#     # A persisted cap below the guaranteed count (possible with configs
#     # saved by older builds) is raised to it automatically on save, so a
#     # stale config self-heals instead of rejecting every settings change.
#     # WARNING: this budget cannot cap the guaranteed set — the 12 default
#     # always-present tools ∪ 5 protected (4 overlap → 13 unique) plus
#     # EVERY MCP-sourced tool are never trimmed. Several MCP servers can
#     # push the tool set past the ~10–20-tool safe zone where tool-selection
#     # accuracy measurably degrades. Trim always_present or the MCP server
#     # list to compensate. See specs/domains/small-llm.md and
#     # docs/small-llm-defaults-research.md.
#     max_tools: 16
#     # Replace every known builtin's full description (rubric:
#     # purpose/when-to-use/inputs/outputs/example/anti-example, 480-1100
#     # chars) with a one-line compact variant while this variant is active —
#     # saves prompt tokens on small models. Off by default: when off,
#     # descriptions are byte-identical to the non-small-LLM behavior.
#     # Unknown tools (e.g. MCP) always keep their original descriptions.
#     compact_descriptions: false
#
#   # --- System Prompt Simplification ---------------------------------------
#   # Applies prompt-simplification variants to shrink the system prompt. Each
#   # flag is independent; few_shot and reasoning_scaffold only take effect
#   # when lite is on (both are tailored to the compact lite directive).
#   system_prompt:
#     # Trims verbose guidance from the base system prompt, swapping the verbose
#     # OrchestratorSystem directive for the compact OrchestratorSystemLite.
#     lite: false
#     # Appends curated worked-example ReAct cycles (correct tool-call format,
#     # tool choice, error recovery, finish). Only applied when lite is on.
#     few_shot: false
#     # Appends a lightweight three-step reasoning scaffold (goal → tool+why
#     # → args). Only applied when lite is on.
#     reasoning_scaffold: false
#
#   # --- Sampling Overrides --------------------------------------------------
#   # Overrides LLM sampling parameters for more deterministic, lower-effort
#   # generation suitable for smaller models.
#   sampling:
#     # Gates this variant.
#     enabled: false
#     # Every sampling numeric parameter uses "inherit by default": an unset
#     # (zero) value keeps the per-family vendor preset instead of replacing
#     # it with a constant. Only explicitly set parameters override the
#     # preset. The one exception is reasoning_effort (see below), which
#     # seeds "medium" — so enabling this variant with no explicit values
#     # lowers the reasoning depth from the inherited vendor default
#     # (xhigh on qwen thinking models) to medium.
#     # Generation temperature (lower = more deterministic). When set, must
#     # be > 0. Default: inherit the vendor preset.
#     temperature: 0
#     # Nucleus-sampling probability mass. When set, must be in (0, 1].
#     # Default: inherit the vendor preset.
#     top_p: 0
#     # Top-k sampling. When set, must be >= 1. Only sent to providers that
#     # support it (Anthropic, Google, LM Studio/vLLM-style endpoints).
#     # Default: inherit the vendor preset.
#     top_k: 0
#     # Repetition penalty. When set, must be in [1, 2]. Only sent to
#     # providers that support it (LM Studio/vLLM-style endpoints).
#     # Default: inherit the vendor preset.
#     repetition_penalty: 0
#     # Presence penalty (OpenAI-schema anti-repetition lever). When set,
#     # must be in [0, 2] — the Qwen card sanctions 0–2 (instruct default
#     # 1.5); values above 2 increase language mixing. Unlike
#     # repetition_penalty this is part of the official OpenAI Chat
#     # Completions schema, so it is sent to every OpenAI-compatible
#     # endpoint when set (including strict api.openai.com); the Anthropic
#     # and Google providers do not serialize it.
#     # Default: inherit the vendor preset (field not sent).
#     presence_penalty: 0
#     # Reasoning depth: "off" | "low" | "medium". Default: "medium" when
#     # unset — an empty/absent value inherits the model's own default,
#     # which for qwen thinking models is "xhigh": measured overthinking on
#     # trivial tasks (22,276 reasoning tokens / 21 min for a simple SVG vs
#     # 3,715 tokens / 137 s with thinking off). "medium" is the model's
#     # native pre-training regime — no effort instruction is injected —
#     # and cuts thinking-token spend 60–90%. Prefer it over "low" for
#     # agentic work: Qwen warns that reduced effort can *increase* total
#     # time in multi-turn agent tasks via failures and retries. Explicit
#     # values here are never overwritten by the default; "" is the
#     # documented "unset" sentinel and resolves to "medium" — disable this
#     # variant to inherit the vendor xhigh default instead.
#     # Rationale: docs/small-llm-defaults-research.md (R3).
#     reasoning_effort: medium
#
#   # --- Loop Hardening ------------------------------------------------------
#   # Tightens the executor circuit-breaker thresholds so a small model that
#   # repeats itself or makes no progress is nudged/aborted sooner, conserving
#   # the token budget. These are tighter than the baseline
#   # executor.circuitBreaker values.
#   loop_hardening:
#     # Gates this variant.
#     enabled: false
#     # Consecutive identical tool calls before a corrective nudge.
#     # Default: 2.
#     repeat_nudge_threshold: 2
#     # Consecutive response parse errors before the executor aborts.
#     # Default: 3.
#     parse_error_abort_threshold: 3
#     # Consecutive minimal-result tool calls before a corrective nudge.
#     # Default: 3.
#     fruitless_nudge_threshold: 3
#     # Consecutive minimal-result tool calls before the executor aborts.
#     # Default: 5.
#     fruitless_abort_threshold: 5
#     # Same-tool (varied args, similar results) calls before a corrective
#     # nudge. Default: 4.
#     same_tool_repeat_nudge_threshold: 4
#
#   # --- Context Management --------------------------------------------------
#   # Aggressive context management for small context windows: tightens
#   # compaction, prunes older tool outputs harder, and reserves headroom for
#   # the model's own answer. Every value here is tighter than the general
#   # executor/compaction defaults (keep_last 10, block_size 7, trigger 85%,
#   # tool keep_last 3) — except the reserve, which is deliberately LARGER
#   # than the general executor default (8192); see output_token_reserve
#   # below for why.
#   context:
#     # Gates this variant in addition to the master `enabled` toggle above
#     # (overrides are applied only when both are on).
#     enabled: false
#     # Compaction overrides (context.compaction keeps the general
#     # keep_last/block_size/trigger_percent semantics, with tighter values).
#     compaction:
#       # Messages kept verbatim at the conversation tail during compaction.
#       # Default: 6 (vs 10 general).
#       keep_last: 6
#       # Batch size for pruning per compaction round. Default: 5 (vs 7).
#       block_size: 5
#       # Percentage of the context window at which compaction triggers.
#       # Default: 80 (vs 85).
#       trigger_percent: 80
#     # Tool outputs: keep only the N most recent outputs verbatim; older ones
#     # are pruned harder than the general keep_last 3. Default: 2. Must be
#     # >= 1 when the variant is enabled.
#     tool_output_keep_last_n: 2
#     # Output reserve for the router's pre-submission context-window
#     # validation: it overrides executor.output_token_reserve while this
#     # variant is on and is consulted ONLY as the fallback when a model's
#     # resolved metadata carries no OutputLimit (the registry resolves a
#     # catalog, probe-cache, or 32768 static value for every model, so
#     # this is effectively unreachable). This knob does NOT change the
#     # per-request MaxTokens generation ceiling: the ceiling is the
#     # model's resolved OutputLimit — raise llm.models.<model>.
#     # output_limit (or the per-provider llm.<provider>.
#     # output_token_reserve) when a thinking model's catalog ceiling
#     # (e.g. 8192) truncates reasoning + answer (thinking tokens are
#     # spent before content; measured ~3.7K–22.3K per turn).
#     # Default: 16384 (thinking-aware fallback headroom vs the general
#     # executor default 8192).
#     # Must be >= 1 when the variant is enabled.
#     output_token_reserve: 16384

# ---------------------------------------------------------------------------
# Goal — budget model.
# ---------------------------------------------------------------------------
# A goal captures the user's success condition and bounds how much work the
# agent may spend reaching it. The budget is turn-only: the agent pursues the
# goal until it declares the condition met, goes idle (anti-spin), or hits the
# turn cap. There are no token or wall-clock caps at the config level — a
# per-goal turn limit is selected in the UI (BudgetCombobox: ∞ / 3 / 5 / 10
# turns, or a custom number). An unlimited goal (∞) has no internal turn cap —
# the user controls it via pause/stop.



# ---------------------------------------------------------------------------
# Terminal — embedded PTY terminal (the in-app terminal panel).
# ---------------------------------------------------------------------------
# The terminal panel runs your login shell inside the app (xterm.js over a
# PTY). The shell always receives TERM=xterm-256color, COLORTERM=truecolor
# and TERM_PROGRAM=c0wrk (+ TERM_PROGRAM_VERSION). TERM_PROGRAM identifies
# the embedded terminal so your shell rc files can tell it apart from your
# real terminal — the same convention VSCode (TERM_PROGRAM=vscode), WezTerm
# and ghostty use.
#
# tmux users: if your rc auto-attaches tmux, guard it so the embedded
# terminal opens a fresh shell in the project directory instead of
# hijacking your live tmux session:
#
#   # ~/.zshrc
#   if [[ -z "$TMUX" && "$TERM_PROGRAM" != "c0wrk" ]]; then
#     tmux attach -t main || tmux new -s main
#   fi
#
# (A bare `exec tmux` with no guards cannot be intercepted by any app —
# the same is true in VSCode.)
#
# terminal:
#   # Extra environment variables for every terminal shell process. Values
#   # win over the inherited environment AND the built-in defaults above;
#   # ${VAR} references are expanded at startup. Use them to feed your rc
#   # files any marker they check (e.g. your own guard variable).
#   env:
#     C0WRK_TERMINAL: "1"
#     # MY_MARKER: ${MY_MARKER_VALUE}

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux:
    strategy:
      # A failed arm64 leg must not cancel the amd64 diagnostics.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config xvfb ripgrep

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Install frontend dependencies
        run: cd frontend && npm install

      - name: Build frontend assets
        run: cd frontend && npm run build

      # golangci-lint is arch-independent and slow to install from source;
      # run it on the amd64 leg only. Tests run on both legs.
      - name: Lint (Go)
        if: matrix.arch == 'amd64'
        run: golangci-lint run

      - name: Lint (frontend)
        if: matrix.arch == 'amd64'
        run: cd frontend && npm run lint

      - name: Test (Go)
        run: go test ./...

      - name: Test (frontend)
        run: cd frontend && npm test

      - name: Build
        run: xvfb-run make build

  macos:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install system dependencies
        run: brew install ripgrep

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Install frontend dependencies
        run: cd frontend && npm install

      - name: Build frontend assets
        run: cd frontend && npm run build

      - name: Lint (Go)
        run: golangci-lint run

      - name: Lint (frontend)
        run: cd frontend && npm run lint

      - name: Test (Go)
        run: go test ./...

      - name: Test (frontend)
        run: cd frontend && npm test

      - name: Build
        run: make build

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # onnxruntime_go (transitive via sp4rk/embedding) is CGO-dependent, so the
      # C toolchain (MinGW-w64 gcc, installed below) must be enabled for compile,
      # lint, test, and the wails build to succeed on Windows.
      CGO_ENABLED: "1"
    steps:
      # Preserve LF line endings: MSYS2/Git may otherwise CRLF-convert checked-out
      # sources, which breaks shell scripts and Go tooling that assume LF.
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up MinGW-w64 (gcc for CGO)
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Expose MinGW gcc on PATH (for CGO in default shell)
        # Ensures gcc is discoverable by `go test`/`golangci-lint`/`wails build`
        # regardless of whether setup-msys2 prepends mingw64/bin to GITHUB_PATH.
        run: echo "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin" >> $env:GITHUB_PATH

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Install frontend dependencies
        run: cd frontend && npm install

      - name: Build frontend assets
        run: cd frontend && npm run build

      - name: Lint (Go)
        run: golangci-lint run

      - name: Lint (frontend)
        run: cd frontend && npm run lint

      - name: Test (Go)
        run: go test ./...

      - name: Test (frontend)
        run: cd frontend && npm test

      - name: Build (Wails)
        run: wails build

      - name: Fetch ONNX Runtime (Windows)
        run: powershell -ExecutionPolicy Bypass -File scripts/fetch-onnx.ps1

      - name: Fetch embedding model (Windows)
        run: powershell -ExecutionPolicy Bypass -File scripts/fetch-embedding-model.ps1

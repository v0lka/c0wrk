name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  linux:
    strategy:
      # A failed arm64 leg must not cancel the amd64 diagnostics.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libx11-dev build-essential pkg-config xvfb ripgrep

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      # golangci-lint is arch-independent and slow to install from source;
      # install and run it on the amd64 leg only. Tests run on both legs.
      - name: Install golangci-lint
        if: matrix.arch == 'amd64'
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      # npm audit is arch- and OS-independent: run the production-dependency
      # vulnerability gate on the amd64 leg only.
      - name: Audit frontend production dependencies
        if: matrix.arch == 'amd64'
        run: cd frontend && npm audit --omit=dev --audit-level=low

      - name: Build frontend assets
        run: cd frontend && npm run build

      - name: Lint (Go)
        if: matrix.arch == 'amd64'
        run: golangci-lint run

      - name: Lint (frontend)
        if: matrix.arch == 'amd64'
        run: cd frontend && npm run lint

      - name: Test (Go default, including controlled integration)
        shell: bash
        run: go test -count=1 -v -skip '^TestStress' ./... 2>&1 | awk '!/^( *--- PASS|=== (RUN|PAUSE|CONT|NAME)|PASS$|ok[ \t])/'

      - name: Test (Go probabilistic stress, required coverage)
        if: ${{ !cancelled() }}
        run: go run ./internal/teststress

      - name: Test (frontend)
        run: cd frontend && npm test

      - name: Build
        run: xvfb-run make build

      # The committed `frontend/wailsjs/go/` bindings are the Go ↔ TS contract
      # (specs/contracts/desktop-frontend.md) and are rewritten by every
      # `wails build`. No build or test step consumes them mechanically, so a
      # PR can otherwise merge with stale bindings (as happened after #193).
      # Fail when the build just performed rewrote them: the author must run
      # the same build locally and commit the result. `frontend/wailsjs/runtime/`
      # is untracked by design and is deliberately not checked.
      - name: Verify committed wailsjs/go bindings are fresh
        shell: bash
        run: |
          drift="$(git status --porcelain -- frontend/wailsjs/go)"
          if [ -n "$drift" ]; then
            echo "::error::frontend/wailsjs/go bindings are stale. Run 'make build' locally and commit the regenerated bindings."
            echo "$drift"
            git diff --stat -- frontend/wailsjs/go
            exit 1
          fi
          echo "OK: committed wailsjs/go bindings match the build output"

      # Recipe smoke for the OpenVINO flavor channel (ADR-046 pattern): a
      # broken wheel URL, a stale pinned digest, or a recipe regression must
      # fail the PR instead of the release. Runs the real download + digest
      # verification + extraction (~50 MiB from PyPI) on the amd64 leg, where
      # the pinned manylinux wheel applies. unzip is preinstalled on the
      # runner image; the target itself fails closed without it.
      - name: Smoke ONNX Runtime OpenVINO flavor fetch
        if: matrix.arch == 'amd64'
        run: make fetch-onnx-openvino

      # The flavor target is Linux x64-only by design: on arm64 it must fail
      # closed (no download, clear error) — assert exactly that so a
      # platform-gate regression cannot go unnoticed.
      - name: OpenVINO flavor fetch refuses arm64
        if: matrix.arch == 'arm64'
        run: |
          if make fetch-onnx-openvino; then
            echo "::error::fetch-onnx-openvino unexpectedly succeeded on arm64"
            exit 1
          fi
          echo "OK: fetch-onnx-openvino fails closed on arm64"

  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install system dependencies
        run: brew install ripgrep

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build frontend assets
        run: cd frontend && npm run build

      - name: Lint (Go)
        run: golangci-lint run

      - name: Lint (frontend)
        run: cd frontend && npm run lint

      - name: Test (Go default, including controlled integration)
        shell: bash
        run: go test -count=1 -v -skip '^TestStress' ./... 2>&1 | awk '!/^( *--- PASS|=== (RUN|PAUSE|CONT|NAME)|PASS$|ok[ \t])/'

      - name: Test (Go probabilistic stress, required coverage)
        if: ${{ !cancelled() }}
        run: go run ./internal/teststress

      - name: Test (frontend)
        run: cd frontend && npm test

      - name: Build
        run: make build

      # Same freshness gate as the linux job: committed `frontend/wailsjs/go/`
      # bindings must match what the pinned wails CLI generates.
      - name: Verify committed wailsjs/go bindings are fresh
        shell: bash
        run: |
          drift="$(git status --porcelain -- frontend/wailsjs/go)"
          if [ -n "$drift" ]; then
            echo "::error::frontend/wailsjs/go bindings are stale. Run 'make build' locally and commit the regenerated bindings."
            echo "$drift"
            git diff --stat -- frontend/wailsjs/go
            exit 1
          fi
          echo "OK: committed wailsjs/go bindings match the build output"

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # onnxruntime_go (transitive via sp4rk/embedding) is CGO-dependent, so the
      # C toolchain (MinGW-w64 gcc, installed below) must be enabled for compile,
      # lint, test, and the wails build to succeed on Windows.
      CGO_ENABLED: "1"
      # proxy.golang.org intermittently resets HTTP/2 streams with
      # "stream error ... INTERNAL_ERROR; received from peer" when fetching
      # modules (seen with the Windows-only conpty dependency). Disable HTTP/2
      # so module downloads fall back to HTTP/1.1 and dodge that flake.
      GODEBUG: "http2client=0"
    steps:
      # Preserve LF line endings: MSYS2/Git may otherwise CRLF-convert checked-out
      # sources, which breaks shell scripts and Go tooling that assume LF.
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up MinGW-w64 (gcc for CGO)
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Expose MinGW gcc on PATH (for CGO in default shell)
        # Ensures gcc is discoverable by `go test`/`golangci-lint`/`wails build`
        # regardless of whether setup-msys2 prepends mingw64/bin to GITHUB_PATH.
        run: echo "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin" >> $env:GITHUB_PATH

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build frontend assets
        run: cd frontend && npm run build

      - name: Lint (Go)
        run: golangci-lint run

      - name: Lint (frontend)
        run: cd frontend && npm run lint

      # The fetch-onnx / fetch-embedding-model scripts no longer run in CI
      # (they download large artifacts the build does not need), so at least
      # parse-check them here: a syntax error in either script would otherwise
      # ship unnoticed until a Windows `make build`.
      - name: Syntax-check PowerShell fetch scripts
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($script in @("scripts/fetch-onnx.ps1", "scripts/fetch-embedding-model.ps1")) {
            $tokens = $null
            $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script).Path, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors -and $parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object {
                Write-Host "::error file=$script,line=$($_.Extent.StartLineNumber)::$($_.Message)"
              }
              throw "PowerShell parse errors found in $script"
            }
            Write-Host "OK: $script"
          }

      # The -v stream is filtered down to the signal: the awk pass-through
      # drops only the verbose pass markers (=== RUN/PAUSE/CONT/NAME,
      # --- PASS at any depth, bare PASS, `ok` package lines), so a clean run
      # logs nothing while every failure, skip and stray test diagnostic
      # stays visible. shell: bash guarantees pipefail propagates go test's
      # exit code on every OS (pwsh on Windows would mask it).
      - name: Test (Go default, including controlled integration)
        shell: bash
        run: go test -count=1 -v -skip '^TestStress' ./... 2>&1 | awk '!/^( *--- PASS|=== (RUN|PAUSE|CONT|NAME)|PASS$|ok[ \t])/'

      - name: Test (Go probabilistic stress, required coverage)
        if: ${{ !cancelled() }}
        run: go run ./internal/teststress

      - name: Test (frontend)
        run: cd frontend && npm test

      - name: Build (Wails)
        run: wails build

      # Same freshness gate as the linux/macos jobs: committed
      # `frontend/wailsjs/go/` bindings must match what the pinned wails CLI
      # generates.
      - name: Verify committed wailsjs/go bindings are fresh
        shell: bash
        run: |
          drift="$(git status --porcelain -- frontend/wailsjs/go)"
          if [ -n "$drift" ]; then
            echo "::error::frontend/wailsjs/go bindings are stale. Run 'wails build' locally and commit the regenerated bindings."
            echo "$drift"
            git diff --stat -- frontend/wailsjs/go
            exit 1
          fi
          echo "OK: committed wailsjs/go bindings match the build output"

  # Dependency vulnerability gate: fails CI when a Go vulnerability from the
  # official database is reachable from this module's code. Run once, not
  # per-OS like the build/test matrix: scan results are OS/arch-independent.
  # Mirrors the same gate in the sp4rk SDK CI.
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"

      # Same system dependencies as the linux job: govulncheck must load
      # (compile) every package under ./..., and desktop/ pulls in wails,
      # which needs the gtk/webkit2gtk cgo headers on Linux.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libx11-dev build-essential pkg-config

      # Runs the exact same command as local `make vulncheck` (the Makefile
      # pins the govulncheck version), so local and CI results are identical.
      - name: Vulnerability scan (Go)
        run: make vulncheck

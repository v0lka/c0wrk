name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  linux:
    strategy:
      # A failed arm64 leg must not cancel the amd64 diagnostics.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config xvfb ripgrep

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      # golangci-lint is arch-independent and slow to install from source;
      # install and run it on the amd64 leg only. Tests run on both legs.
      - name: Install golangci-lint
        if: matrix.arch == 'amd64'
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2

      - name: Install frontend dependencies
        run: cd frontend && npm install

      # npm audit is arch- and OS-independent: run the production-dependency
      # vulnerability gate on the amd64 leg only.
      - name: Audit frontend production dependencies
        if: matrix.arch == 'amd64'
        run: cd frontend && npm audit --omit=dev --audit-level=low

      - name: Build frontend assets
        run: cd frontend && npm run build

      - name: Lint (Go)
        if: matrix.arch == 'amd64'
        run: golangci-lint run

      - name: Lint (frontend)
        if: matrix.arch == 'amd64'
        run: cd frontend && npm run lint

      - name: Test (Go)
        run: go test ./...

      - name: Test (frontend)
        run: cd frontend && npm test

      - name: Build
        run: xvfb-run make build

  macos:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install system dependencies
        run: brew install ripgrep

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2

      - name: Install frontend dependencies
        run: cd frontend && npm install

      - name: Build frontend assets
        run: cd frontend && npm run build

      - name: Lint (Go)
        run: golangci-lint run

      - name: Lint (frontend)
        run: cd frontend && npm run lint

      - name: Test (Go)
        run: go test ./...

      - name: Test (frontend)
        run: cd frontend && npm test

      - name: Build
        run: make build

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # onnxruntime_go (transitive via sp4rk/embedding) is CGO-dependent, so the
      # C toolchain (MinGW-w64 gcc, installed below) must be enabled for compile,
      # lint, test, and the wails build to succeed on Windows.
      CGO_ENABLED: "1"
    steps:
      # Preserve LF line endings: MSYS2/Git may otherwise CRLF-convert checked-out
      # sources, which breaks shell scripts and Go tooling that assume LF.
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up MinGW-w64 (gcc for CGO)
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Expose MinGW gcc on PATH (for CGO in default shell)
        # Ensures gcc is discoverable by `go test`/`golangci-lint`/`wails build`
        # regardless of whether setup-msys2 prepends mingw64/bin to GITHUB_PATH.
        run: echo "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin" >> $env:GITHUB_PATH

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2

      - name: Install frontend dependencies
        run: cd frontend && npm install

      - name: Build frontend assets
        run: cd frontend && npm run build

      - name: Lint (Go)
        run: golangci-lint run

      - name: Lint (frontend)
        run: cd frontend && npm run lint

      # The fetch-onnx / fetch-embedding-model scripts no longer run in CI
      # (they download large artifacts the build does not need), so at least
      # parse-check them here: a syntax error in either script would otherwise
      # ship unnoticed until a Windows `make build`.
      - name: Syntax-check PowerShell fetch scripts
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($script in @("scripts/fetch-onnx.ps1", "scripts/fetch-embedding-model.ps1")) {
            $tokens = $null
            $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script).Path, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors -and $parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object {
                Write-Host "::error file=$script,line=$($_.Extent.StartLineNumber)::$($_.Message)"
              }
              throw "PowerShell parse errors found in $script"
            }
            Write-Host "OK: $script"
          }

      - name: Test (Go)
        run: go test ./...

      - name: Test (frontend)
        run: cd frontend && npm test

      - name: Build (Wails)
        run: wails build

  # Dependency vulnerability gate: fails CI when a Go vulnerability from the
  # official database is reachable from this module's code. Run once, not
  # per-OS like the build/test matrix: scan results are OS/arch-independent.
  # Mirrors the same gate in the sp4rk SDK CI.
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"

      # Same system dependencies as the linux job: govulncheck must load
      # (compile) every package under ./..., and desktop/ pulls in wails,
      # which needs the gtk/webkit2gtk cgo headers on Linux.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config

      # Runs the exact same command as local `make vulncheck` (the Makefile
      # pins the govulncheck version), so local and CI results are identical.
      - name: Vulnerability scan (Go)
        run: make vulncheck

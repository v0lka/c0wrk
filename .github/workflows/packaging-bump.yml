name: Packaging bump

# Points c0wrk-bin at a published release: rewrites _tag, refreshes every
# sha256sum from the release's own SHA256SUMS, regenerates .SRCINFO, and opens
# a PR with the result. Optionally publishes to the AUR.
#
# c0wrk-git is deliberately untouched — its pkgver() derives from git describe,
# so it needs no per-release edit. What it does need is the pin check, which
# runs here as a guard and in the Packaging workflow on every PR.
#
# Called by release.yml after the release is published, and runnable on its own
# to redo a bump: to recover from a failed PR step, or to publish an older
# release to the AUR once the secret is in place.
#
# WHY THIS IS NOT TRIGGERED BY `on: release`
# A release created with GITHUB_TOKEN — which is what action-gh-release uses —
# does not trigger further workflow runs. GitHub suppresses that to avoid
# recursion, so a `release: published` trigger here would simply never fire.
# release.yml calls this workflow directly instead.

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to track (e.g. v0.8.0)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to track (e.g. v0.8.0)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # makepkg regenerates .SRCINFO, so this needs a real Arch userspace.
    container: archlinux:base-devel
    steps:
      - name: Install tooling
        run: pacman -Syu --noconfirm --needed git github-cli openssh python

      - uses: actions/checkout@v4
        with:
          # Always bump the packaging on the default branch, never on the tag:
          # the tag's tree predates the release it is being pointed at.
          ref: main
          # A PAT here makes the resulting PR run CI. With the default
          # GITHUB_TOKEN the PR is created but no workflows run on it, because
          # GITHUB_TOKEN-authored events do not trigger workflows.
          token: ${{ secrets.PACKAGING_PR_TOKEN || secrets.GITHUB_TOKEN }}

      # makepkg refuses to run as root and the container runs as root, so the
      # bump runs as an unprivileged owner of the tree. git runs as root
      # afterwards, hence safe.directory.
      - name: Prepare build user
        run: |
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Bump c0wrk-bin to ${{ inputs.tag }}
        run: su builder -c "packaging/archlinux/bump-bin.sh '${{ inputs.tag }}'"

      # Cheap guard: a release that bumps ONNX or Wails should not land a
      # packaging PR that still pins the old versions for c0wrk-git.
      - name: Check c0wrk-git pins
        run: su builder -c "packaging/archlinux/check-pins.sh"

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet -- packaging/archlinux; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Packaging already tracks ${{ inputs.tag }} — nothing to do." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- packaging/archlinux
          fi

      - name: Open pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.PACKAGING_PR_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -eu
          branch="packaging/c0wrk-bin-$TAG"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Re-running for the same tag should update the existing branch rather
          # than fail, so the branch is recreated and force-pushed.
          git switch -C "$branch"
          git add packaging/archlinux
          git commit -m "chore(packaging): point c0wrk-bin at $TAG

          Generated by packaging/archlinux/bump-bin.sh. Rewrites _tag, resets
          pkgrel, refreshes every sha256sum from the release's SHA256SUMS asset,
          and regenerates .SRCINFO.

          Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>"
          git push --force origin "$branch"

          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "PR for $branch already open; branch updated in place." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore(packaging): point c0wrk-bin at $TAG" \
            --body "$(cat <<EOF
          Automated by [\`packaging/archlinux/bump-bin.sh\`](packaging/archlinux/bump-bin.sh) after publishing \`$TAG\`.

          - \`_tag\` rewritten, \`pkgrel\` reset to 1
          - every \`sha256sums\` entry refreshed — the release archives from the release's own \`SHA256SUMS\` asset, the rest fetched or hashed locally
          - \`.SRCINFO\` regenerated

          \`c0wrk-git\` needs no per-release change: its \`pkgver()\` derives from \`git describe\`. Its pinned build inputs were checked against the Makefile and \`release.yml\` in this run.

          🤖 Generated with [Claude Code](https://claude.com/claude-code)
          EOF
          )"

      # --- AUR publishing -----------------------------------------------------
      # Opt-in: does nothing until AUR_SSH_KEY exists. The `secrets` context is
      # not available to step-level `if`, so presence is resolved into an output
      # first.
      - name: Is AUR publishing configured?
        id: aur
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          if [ -n "${AUR_SSH_KEY:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "AUR publishing skipped: no AUR_SSH_KEY secret." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish to AUR
        if: steps.aur.outputs.enabled == 'true'
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          # Optional. Pin AUR's host keys by setting this to the output of
          # `ssh-keyscan aur.archlinux.org`. Without it the keys are learned on
          # first contact, which cannot be verified from inside the job.
          AUR_KNOWN_HOSTS: ${{ secrets.AUR_KNOWN_HOSTS }}
          TAG: ${{ inputs.tag }}
        run: |
          set -eu
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          if [ -n "${AUR_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$AUR_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::AUR host keys learned on first contact; set AUR_KNOWN_HOSTS to pin them"
            ssh-keyscan aur.archlinux.org > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o IdentitiesOnly=yes"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          pushed="" skipped=""
          for pkg in c0wrk-bin c0wrk-git; do
            work=$(mktemp -d)
            if ! git clone "ssh://aur@aur.archlinux.org/$pkg.git" "$work" 2>/dev/null; then
              echo "::warning::$pkg is not registered on the AUR — skipped"
              skipped="$skipped $pkg"
              continue
            fi

            # git ls-files is the file list: it is exactly what is tracked, so
            # build artifacts and downloaded sources can never leak into the AUR
            # repository even when they are sitting in the working tree.
            rm -f "$work"/*
            for f in $(git ls-files "packaging/archlinux/$pkg"); do
              cp "$f" "$work/"
            done

            if git -C "$work" diff --quiet && git -C "$work" diff --cached --quiet && [ -z "$(git -C "$work" ls-files --others --exclude-standard)" ]; then
              echo "$pkg on the AUR is already up to date"
              continue
            fi

            git -C "$work" add -A
            git -C "$work" commit -m "Update to $TAG"
            git -C "$work" push
            pushed="$pushed $pkg"
          done

          {
            echo "### AUR"
            echo "- pushed:${pushed:- none}"
            echo "- skipped (not registered):${skipped:- none}"
          } >> "$GITHUB_STEP_SUMMARY"
